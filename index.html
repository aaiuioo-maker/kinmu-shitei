<script>
// =============================================================
// 音が出なくなる対策：アプリを裏に回したり、ほかのアプリが音を使ったりして止まった
//   音のしくみ（AudioContext）を、アプリに戻ったときや画面をさわったときに自動で再開する
// =============================================================
(function ccAudioKeep() {
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  const list = [];
  function Keep(...args) { const c = new A(...args); list.push(c); return c; }
  Keep.prototype = A.prototype;
  window.AudioContext = Keep;
  if (window.webkitAudioContext) window.webkitAudioContext = Keep;
  // 止まっていたら（suspended・interrupted など）再開する
  const kick = () => list.forEach(c => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, kick, true));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  addEventListener('pageshow', kick);
  addEventListener('focus', kick);
})();
</script>

<style>
  #ccIntro {
    display: none; position: fixed; inset: 0; z-index: 99999;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    const keepAudioAlive = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
    document.addEventListener('touchstart', keepAudioAlive, { passive: true });
    document.addEventListener('click',      keepAudioAlive, { passive: true });
    document.addEventListener('scroll',     keepAudioAlive, { passive: true, capture: true });

    // ── オープニング（よく行く場所と同じ作り）──
    //   1回目のタップ：ピコッ → カタカタ（キーボード）→ ピロリン と鳴り、GitHub のマークが回って、2.3秒後にいつもの画面へ
    //   鳴っている間にもう一度タップすると、すぐいつもの画面へ
    function opTone(f, t, d, v) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(1e-4, t);
      g.gain.exponentialRampToValueAtTime(v, t + .005);
      g.gain.exponentialRampToValueAtTime(1e-4, t + d);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + .02);
    }
    // カタッ（キーボードを打つ音）。d 秒あとに鳴らす
    function opKey(d) {
      const t = audioCtx.currentTime + .01 + d;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 1700 + Math.random() * 500;
      g.gain.setValueAtTime(.035, t); g.gain.exponentialRampToValueAtTime(.001, t + .025);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .035);
    }
    (function opening() {
      const op = document.getElementById('op');
      if (!op) return;
      const h = new Date().getHours();
      document.getElementById('ophello').textContent = h < 5 ? '夜おそくまで、おつかれさまです' : h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'おつかれさまです';
      const TIPS = [
        '名前をタップすると、黄色以外のコース欄をまとめて入力できます',
        '「◀ 前」「次 ▶」で4週間ずつ移動します',
        '「今日」を押すと、今日から始まる表に戻ります',
        '「📷画像」で、表を画像にしてLINEなどに送れます',
        '「⬆️保存」でバックアップ、「⬇️復元」で読み込みができます',
        'コースが「出張」の日はピンク、休みの日は黄色になります'];
      document.getElementById('optip').textContent = 'ひとこと：' + TIPS[Math.floor(Math.random() * TIPS.length)];
      let started = false;
      function close() {
        if (op.classList.contains('hide')) return;
        op.classList.add('hide');
        document.getElementById('appContent').style.display = 'block';
        setTimeout(() => op.remove(), 600);
      }
      op.addEventListener('click', () => {
        if (started) { close(); return; }
        started = true;
        try {
          initAudio();
          const t = audioCtx.currentTime + .01;
          opTone(1046, t, .05, .06); opTone(1318, t + .06, .05, .06);                          // ピコッ
          for (let i = 0; i < 14; i++) opKey(.15 + i * .095 + Math.random() * .03);            // カタカタ…
          [1318.5, 1568, 2093].forEach((f, i) => opTone(f, t + 1.65 + i * .06, i === 2 ? .13 : .05, .11)); // ピロリン
        } catch (_) {}
        const go = document.getElementById('opgo');
        go.textContent = '準備中…'; go.classList.add('busy');
        op.querySelector('.op-gh').classList.add('spin');                                      // GitHub のマークがくるっと回る
        requestAnimationFrame(() => { document.getElementById('opbar').style.width = '100%'; });
        setTimeout(close, 2300);
      });
    })();

    /* ── ファミコン音源ヘルパー ── */

    // duty比指定の矩形波（ファミコン実機: 12.5 / 25 / 50 / 75%）
    function _sq(c, freq, t, dur, vol, duty) {
      const N = 32, real = new Float32Array(N), imag = new Float32Array(N);
      for (let k = 1; k < N; k++) imag[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
      const wave = c.createPeriodicWave(real, imag, { disableNormalization: false });
      const osc = c.createOscillator(); osc.setPeriodicWave(wave);
      osc.frequency.setValueAtTime(freq, t);
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.008);
      g.gain.setValueAtTime(vol, t + dur * 0.78);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    // 三角波（ch3 ベース用）
    function _tri(c, freq, t, dur, vol) {
      const osc = c.createOscillator(); osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.setValueAtTime(vol, t + dur * 0.85);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    // ノイズ（ch4 打楽器）
    function _nz(c, t, dur, vol, band) {
      const n = Math.ceil(c.sampleRate * dur);
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      let lp = 0;
      for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; lp = 0.25 * w + 0.75 * lp; d[i] = lp; }
      const src = c.createBufferSource(); src.buffer = buf;
      const flt = c.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = band; flt.Q.value = 0.7;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + dur + 0.02);
    }

    /* ══════════════════════════════════════════
       ★ オープニング音：帰局後作業アプリ と同じシーケンス
       ── C5→E5→G5→C6→G5→A5→C6 の7音
    ══════════════════════════════════════════ */
    function playFanfare() {
      initAudio();
      if (!audioCtx) return;
      const c = audioCtx;
      const seq = [
        [523, 0.12],
        [659, 0.12],
        [784, 0.12],
        [1047, 0.20],
        [784, 0.08],
        [880, 0.08],
        [1047, 0.30],
      ];
      let t = c.currentTime + 0.05;
      seq.forEach(([freq, dur]) => {
        const o = c.createOscillator();
        const g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'square';
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur);
        t += dur + 0.02;
      });
    }

    /* ── その他SE ── */

    function playSelect() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playSave() {
      initAudio();
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(659.25,  t);
      osc.frequency.setValueAtTime(880.00,  t + 0.1);
      osc.frequency.setValueAtTime(1318.51, t + 0.2);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.setValueAtTime(0.09, t + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(t + 0.5);
    }

    function playTick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.02);
    }

      }
    });

    const holidays = ["2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23"];
    const names = ["栗田 昌俊","岡崎 安浩","菅原 みづほ","倉持 祥","田中 勝也","吹田 将基","住友 正","北山 圭介","山田 佳之","田嶋 治","北村 学","三輪 晟也","今竹"];
    const shiftsShitei = ["","週休","非番","祝日","日４","日５","日６","中１","中２","中３","中４","夜１"];
    const shiftsCourse = ["","営業","承認欠勤","1","2","3","4","5","6","7","年休","計年","冬期","夏期","出張","休希","MC","支部","マス","コン","通区"];

    // 黄色表示（休み扱い）になる値
    const HOLIDAY_SHITEI = ["週休","非番","祝日"];
    const HOLIDAY_COURSE = ["年休","計年","冬期","夏期","承認欠勤"];

    const MASTER_STORE_KEY = 'Fushimi_Master_Data';
    const LAST_DATE_KEY    = 'Fushimi_Last_Date_Value';
    let currentDates = [];

    function updateTableDates() {
      const startVal = document.getElementById("startDate").value;
      if (!startVal) return;
      localStorage.setItem(LAST_DATE_KEY, startVal);
      const startDate = new Date(startVal);
      currentDates = [];
      let d = new Date(startDate);
      for (let i = 0; i < 28; i++) { currentDates.push(new Date(d)); d.setDate(d.getDate() + 1); }
      renderHeader();
      renderBody();

    function renderHeader() {
      const headerTop    = document.getElementById("headerRowTop");
      const headerBottom = document.getElementById("headerRowBottom");
      while (headerTop.cells.length > 2) headerTop.deleteCell(2);
      headerBottom.innerHTML = "";
      const daysArr  = ["日","月","火","水","木","金","土"];
      const todayStr = new Date().toLocaleDateString('sv-SE');
      currentDates.forEach(date => {
        const dateStr = date.toLocaleDateString('sv-SE');
        const thDay  = document.createElement("th"); thDay.className  = "date-col";
        const thWeek = document.createElement("th"); thWeek.className = "date-col";
        thWeek.textContent = `(${daysArr[date.getDay()]})`;
        if (dateStr === todayStr) {
          thDay.classList.add("today-header"); thWeek.classList.add("today-header");
          thDay.innerHTML = `<div style="font-size:7px;color:red;">今日</div>${date.getMonth()+1}/${date.getDate()}`;
        } else {
          thDay.textContent = `${date.getMonth()+1}/${date.getDate()}`;
        }
        if      (holidays.includes(dateStr)) { thDay.className += " text-purple";    thWeek.className += " text-purple"; }
        else if (date.getDay() === 0)        { thDay.className += " text-red";       thWeek.className += " text-red"; }
        else if (date.getDay() === 6)        { thDay.className += " text-darkgreen"; thWeek.className += " text-darkgreen"; }
        headerTop.appendChild(thDay); headerBottom.appendChild(thWeek);
      });
    }

    function renderBody() {
      const tbody    = document.getElementById("tableBody");
      tbody.innerHTML = "";
      const master   = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
      const todayStr = new Date().toLocaleDateString('sv-SE');
      names.forEach(name => {
        let tr1 = document.createElement("tr"); tr1.className = "row-shitei";
        let tdName  = document.createElement("td"); tdName.className  = "sticky-col1"; tdName.rowSpan = 2; tdName.textContent = name;
        if (name) { tdName.style.cursor = "pointer"; tdName.title = "タップで一括入力"; tdName.addEventListener("click", () => openBulkModal(name)); }
        let tdType1 = document.createElement("td"); tdType1.className = "sticky-col2"; tdType1.textContent = "指定";
        let tr2 = document.createElement("tr"); tr2.className = "row-henkou";
        let tdType2 = document.createElement("td"); tdType2.className = "sticky-col2"; tdType2.textContent = "コース";
        if (name === "住友 正") {
          tdName.style.backgroundColor  = "#e8f7fc";
          tdType1.style.backgroundColor = "#e8f7fc";
          tdType2.style.backgroundColor = "#e8f7fc";
        }
        tr1.appendChild(tdName); tr1.appendChild(tdType1); tr2.appendChild(tdType2);
        currentDates.forEach(date => {
          const dateStr = date.toLocaleDateString('sv-SE');
          const data = master[`${name}_${dateStr}`] || { shitei: "", course: "" };
          const todayCls = dateStr === todayStr ? "date-col today-col" : "date-col";
          let td1 = document.createElement("td"); td1.className = todayCls;
          let sel1 = createSelect(shiftsShitei, data.shitei, name, dateStr, "shitei"); td1.appendChild(sel1); tr1.appendChild(td1);
          let td2 = document.createElement("td"); td2.className = todayCls;
          let sel2 = createSelect(shiftsCourse, data.course, name, dateStr, "course"); td2.appendChild(sel2); tr2.appendChild(td2);
          if (name === "住友 正" && dateStr !== todayStr) {
            td1.style.backgroundColor = "#e8f7fc";
            td2.style.backgroundColor = "#e8f7fc";
          }
          updateStyle(sel1, sel2, td1, td2);
        });
        tbody.appendChild(tr1); tbody.appendChild(tr2);
      });
    }

    function createSelect(opts, val, name, date, type) {
      const sel = document.createElement("select");
      sel.dataset.name = name; sel.dataset.date = date; sel.dataset.type = type;
      opts.forEach(o => {
        const opt = document.createElement("option");
        opt.value = o; opt.textContent = o;
        if (o === val) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = function() {
        playSelect();
        const tr  = this.closest('tr');
        const idx = this.parentElement.cellIndex;
        let s1, s2, t1, t2;
        if (type === "shitei") {
          s1 = this; t1 = this.parentElement;
          t2 = tr.nextElementSibling.cells[idx-1]; s2 = t2.querySelector('select');
        } else {
          s2 = this; t2 = this.parentElement;
          t1 = tr.previousElementSibling.cells[idx+1]; s1 = t1.querySelector('select');
        }
        updateStyle(s1, s2, t1, t2);
        saveSingleChange(name, date, type, this.value);
      };
      return sel;
    }

    // 「承認欠勤」を選択した時、セル内に「承認」「欠勤」の2行オーバーレイを表示する
    function updateTwoLineOverlay(t2, sel2) {
      let overlay = t2.querySelector('.two-line-overlay');
      if (sel2.value === "承認欠勤") {
        t2.classList.add('two-line');
        sel2.style.opacity = '0';
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'two-line-overlay';
          overlay.innerHTML = '<span>承認</span><span>欠勤</span>';
          t2.appendChild(overlay);
        }
        overlay.style.display = 'flex';
      } else {
        t2.classList.remove('two-line');
        sel2.style.opacity = '1';
        if (overlay) overlay.style.display = 'none';
      }
    }

    function updateStyle(s1, s2, t1, t2) {
      t1.classList.remove("bg-holiday","bg-trip","bg-night","bg-day56"); t2.classList.remove("bg-holiday","bg-trip");
      if (s2.value === "出張") {
        t1.classList.add("bg-trip"); t2.classList.add("bg-trip");
      } else if (HOLIDAY_SHITEI.includes(s1.value) || HOLIDAY_COURSE.includes(s2.value)) {
        t1.classList.add("bg-holiday"); t2.classList.add("bg-holiday");
      } else if (s1.value === "夜１") {
        t1.classList.add("bg-night");   // 夜１は指定のマスだけ灰色（コースのマスはそのまま）
      } else if (["日５","日６"].includes(s1.value)) {
        t1.classList.add("bg-day56");   // 日５・日６も指定のマスだけうすいオレンジ
      }
      s2.classList.remove("outlined-text","color-1","color-2","color-3","color-4","color-5","color-6","color-7","color-mc","color-masu","color-kon","color-tsuku","color-kyuki");
      if (["MC","支部"].includes(s2.value)) {
        s2.classList.add("color-mc");
      } else if (s2.value === "マス") {
        s2.classList.add("color-masu");
      } else if (s2.value === "コン") {
        s2.classList.add("color-kon");
      } else if (s2.value === "通区") {
        s2.classList.add("color-tsuku");
      } else if (s2.value === "休希") {
        s2.classList.add("color-kyuki");
      } else if (s2.value && !["年休","計年","冬期","夏期","出張","承認欠勤","休希","営業","支部"].includes(s2.value)) {
        s2.classList.add("outlined-text", "color-" + s2.value);
      }
      updateTwoLineOverlay(t2, s2);
    }

    function saveSingleChange(name, date, type, value) {
      const master = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
      const key = `${name}_${date}`;
      if (!master[key]) master[key] = {};
      master[key][type] = value;
      localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
    }

    let bulkTargetName = "";
    function openBulkModal(name) {
      playSelect();
      bulkTargetName = name;
      document.getElementById("bulkModalName").textContent = name;
      document.getElementById("bulkModal").style.display = "flex";
    }
    function closeBulkModal() {
      document.getElementById("bulkModal").style.display = "none";
      bulkTargetName = "";
    }
    function applyBulkCourse(num) {
      if (!bulkTargetName) return;
      currentDates.forEach(date => {
        const dateStr = (date instanceof Date) ? date.toLocaleDateString('sv-SE') : date;
        const s1sel = document.querySelector(`select[data-name="${bulkTargetName}"][data-date="${dateStr}"][data-type="shitei"]`);
        if (!s1sel) return;
        const s2sel = document.querySelector(`select[data-name="${bulkTargetName}"][data-date="${dateStr}"][data-type="course"]`);
        if (!s2sel) return;
        // 黄色（週休・非番・祝日、年休・計年・冬期・夏期・承認欠勤）の日は上書きしない
        if (HOLIDAY_SHITEI.includes(s1sel.value) || HOLIDAY_COURSE.includes(s2sel.value)) return;
        s2sel.value = num;
        const t1 = s1sel.closest("td");
        const t2 = s2sel.closest("td");
        updateStyle(s1sel, s2sel, t1, t2);
      });
      saveData();
      closeBulkModal();
    }

    // silent=true のときは効果音・アラートを出さない
    function saveData(silent) {
      const master   = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
      const startVal = document.getElementById("startDate").value;
      document.querySelectorAll('select').forEach(sel => {
        const key = `${sel.dataset.name}_${sel.dataset.date}`;
        if (!master[key]) master[key] = {};
        master[key][sel.dataset.type] = sel.value;
      });
      localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
      localStorage.setItem(LAST_DATE_KEY, startVal);
      if (silent === true) return;
      playSave();
      setTimeout(() => alert("保存しました"), 100);
    }

    function applyAIData() {
      const text = document.getElementById('aiInput').value;
      if (!text) { alert("データが入力されていません。"); return; }
      try {
        const aiData = JSON.parse(text);
        if (!aiData.startDate || !aiData.shifts) throw new Error("フォーマットが違います");

        const master    = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
        const startDate = new Date(aiData.startDate);

        // ── ① 該当期間28日間のデータを全員分クリア ──
        for (let i = 0; i < 28; i++) {
          const d = new Date(startDate);
          d.setDate(d.getDate() + i);
          const dateStr = d.toLocaleDateString('sv-SE');
          names.forEach(name => {
            const key = `${name}_${dateStr}`;
            delete master[key];
          });
        }

        // ── ② AIデータを新規書き込み ──
        aiData.shifts.forEach(staff => {
          if (staff.name === "田口 裕行") return;
          let d = new Date(startDate);
          for (let i = 0; i < staff.shitei.length; i++) {
            const dateStr = d.toLocaleDateString('sv-SE');
            const key = `${staff.name}_${dateStr}`;
            master[key] = {
              shitei: staff.shitei[i] || "",
              course: staff.course[i] || ""
            };
            d.setDate(d.getDate() + 1);
          }
        });

        localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
        localStorage.setItem(LAST_DATE_KEY, aiData.startDate);
        playSave();
        setTimeout(() => {
          alert("✅ 期間内データをクリアし、AIデータで新規書き込みしました！\n画面を更新します。");
          document.getElementById('aiModal').style.display = 'none';
          location.reload();
        }, 300);
      } catch(e) {
        alert("読み込みエラー: AIが作成したコードをすべて正確にコピーできているか確認してください。\n" + e.message);
      }
    }

    async function exportToFile() {
      playSelect();
      saveData(true);
      const dataStr    = localStorage.getItem(MASTER_STORE_KEY);
      const dateVal    = localStorage.getItem(LAST_DATE_KEY);
      const backupData = { shifts: JSON.parse(dataStr), startDate: dateVal };
      const today = new Date();
      const blob  = new Blob([JSON.stringify(backupData)], { type: "application/json" });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement("a");
      a.href = url; a.download = `勤務表_${today.getFullYear()}${today.getMonth()+1}${today.getDate()}.json`; a.click();

    function importFromFile() {
      const input = document.getElementById('fileInput');
      input.value = '';   // 同じファイルを続けて選んでも change が発火するようにリセット
      input.click();
    }
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.shifts) {
            localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(imported.shifts));
            if (imported.startDate) localStorage.setItem(LAST_DATE_KEY, imported.startDate);
            playSave();
            setTimeout(() => { alert("復元完了！"); location.reload(); }, 300);
          }
        } catch (err) { alert("形式が違います"); }
      };
      reader.readAsText(file);
      this.value = '';
    });

    function saveImageDirectly() {
      playSelect();
      const loading = document.getElementById("loadingOverlay");
      loading.style.display = 'flex';

      setTimeout(() => {
        try {
          const master = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
          const daysArr = ["日","月","火","水","木","金","土"];
          const todayStr = new Date().toLocaleDateString('sv-SE');
          const nameW=62, typeW=26, dateW=30, rowH=22;
          const cols = currentDates.length;
          const totalW = nameW + typeW + dateW * cols;
          const totalH = rowH * (2 + names.length * 2);
          const canvas = document.createElement('canvas');
          const dpr = Math.min(window.devicePixelRatio||2, 2);
          canvas.width  = totalW * dpr;
          canvas.height = totalH * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,totalW,totalH);
          const fnt=(sz,b)=>`${b?'bold ':' '}${sz}px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif`;
          const rect=(x,y,w,h,fill,stroke,lw)=>{
            if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
            if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);}
          };
          const txt=(t,x,y,sz,bold,color)=>{
            ctx.fillStyle=color||'#000';ctx.font=fnt(sz,bold);
            ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y);
          };
          // 画面表示と同じく黒フチ付きで描く（コース番号用）
          const outlinedTxt=(t,x,y,sz,color)=>{
            ctx.font=fnt(sz,true);ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.lineWidth=1.6;ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(t,x,y);
            ctx.fillStyle=color;ctx.fillText(t,x,y);
            ctx.lineWidth=1;
          };
          // ヘッダー
          rect(0,0,nameW,rowH*2,'#cbd5e1','#777');
          rect(nameW,0,typeW,rowH*2,'#cbd5e1','#777');
          txt('氏名',nameW/2,rowH,8,true);
          txt('区別',nameW+typeW/2,rowH,8,true);
          currentDates.forEach((date,i)=>{
            const x=nameW+typeW+i*dateW;
            const dstr=date.toLocaleDateString('sv-SE');
            const dow=date.getDay();
            const isHol=holidays.includes(dstr);
            const isToday=dstr===todayStr;
            const bg=isToday?'rgba(52,199,89,0.3)':'#e2e8f0';
            const color=isHol?'#800080':dow===0?'#ff0000':dow===6?'#006400':'#000';
            rect(x,0,dateW,rowH,bg,'#777');
            rect(x,rowH,dateW,rowH,bg,'#777');
            txt(`${date.getMonth()+1}/${date.getDate()}`,x+dateW/2,rowH*0.5,7,false,color);
            txt(`(${daysArr[dow]})`,x+dateW/2,rowH*1.5,7,false,color);
          });
          // ボディ
          const cColors={'1':'#007aff','2':'#ff3b30','3':'#34c759','4':'#9370DB','5':'#ff9500','6':'#32ade6','7':'#ffd600'};
          const baseY=rowH*2;
          names.forEach((name,ni)=>{
            const y1=baseY+ni*rowH*2, y2=y1+rowH;
            const isMe=name==='住友 正';
            const nbg=isMe?'#e8f7fc':'#f8fafc';
            rect(0,y1,nameW,rowH*2,nbg,'#777');
            txt(name,nameW/2,y1+rowH,9,false);
            rect(nameW,y1,typeW,rowH,nbg,'#777');
            txt('指定',nameW+typeW/2,y1+rowH/2,7,false,'#555');
            rect(nameW,y2,typeW,rowH,nbg,'#777',2);
            ctx.lineWidth=1;
            txt('コース',nameW+typeW/2,y2+rowH/2,7,false,'#555');
            currentDates.forEach((date,di)=>{
              const dstr=date.toLocaleDateString('sv-SE');
              const data=master[`${name}_${dstr}`]||{shitei:'',course:''};
              const x=nameW+typeW+di*dateW;
              const isToday=dstr===todayStr;
              const isTrip2=data.course==="出張";
              const isHol2=!isTrip2&&(HOLIDAY_SHITEI.includes(data.shitei)||HOLIDAY_COURSE.includes(data.course));
              const cbg=isTrip2?'#ffccdd':isHol2?'#ffff00':isToday?'rgba(52,199,89,0.12)':(isMe?'#e8f7fc':'#fff');
              rect(x,y1,dateW,rowH,(isTrip2||isHol2)?cbg:data.shitei==='夜１'?'#e5e5e5':['日５','日６'].includes(data.shitei)?'#ffe5c7':cbg,'#777');
              txt(data.shitei||'',x+dateW/2,y1+rowH/2,9,false);
              rect(x,y2,dateW,rowH,cbg,'#777',2); ctx.lineWidth=1;
              const c=data.course||'';
              if(c){
                if(cColors[c]){outlinedTxt(c,x+dateW/2,y2+rowH/2,15,cColors[c]);}
                else if(['MC','支部'].includes(c)){txt(c,x+dateW/2,y2+rowH/2,8,true,'#ff2d00');}
                else if(c==='マス'){txt(c,x+dateW/2,y2+rowH/2,8,true,'#003087');}
                else if(['コン','休希'].includes(c)){txt(c,x+dateW/2,y2+rowH/2,8,true,'#ee0000');}
                else if(c==='通区'){txt(c,x+dateW/2,y2+rowH/2,8,true,'#333');}
                else if(c==='承認欠勤'){
                  ctx.fillStyle='#000';ctx.font=fnt(7,true);ctx.textAlign='center';ctx.textBaseline='middle';
                  ctx.fillText('承認',x+dateW/2,y2+rowH/2-5);
                  ctx.fillText('欠勤',x+dateW/2,y2+rowH/2+5);
                } else {txt(c,x+dateW/2,y2+rowH/2,8,false);}
              }
            });
          });
          loading.style.display='none';
          canvas.toBlob(blob=>{
            if(!blob){alert('画像生成失敗');return;}
            playSave();
            const today=new Date();
            const filename=`勤務指定表_${today.getFullYear()}${today.getMonth()+1}${today.getDate()}.jpg`;
            const file=new File([blob],filename,{type:'image/jpeg'});
            if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
              navigator.share({files:[file],title:'勤務指定表'}).catch(()=>fallbackOpenImage(blob,filename));
            } else { fallbackOpenImage(blob,filename); }
          },'image/jpeg',0.92);
        } catch(e){
          document.getElementById("loadingOverlay").style.display='none';
          alert('エラー: '+e.message);
        }
      }, 150);
    }

    function fallbackOpenImage(blob, filename) {
      const blobUrl = URL.createObjectURL(blob);
      if (/iPhone|iPad|iPod|Safari/i.test(navigator.userAgent) && !/Chrome|CriOS/i.test(navigator.userAgent)) {
        setTimeout(() => {
          alert("画像を生成しました。\n次の画面で画像を「長押し」して「写真に追加」を選択してください。");
          window.open(blobUrl, '_blank');

// ---------- 案内役（index.html の左下）用に、コマの絵に書き出す ----------
// 見本の画面（48×48）の (24, 42) が、案内役の絵の足もとの中心 (12, 16) にくる。キャラクターの大きさは そのまま同じ
const RX = 12 - 24, RY = 16 - GROUND, STEP = 100, T0 = 0.8, T1 = 3.6;
const hex2 = a => Math.round(clamp(a) * 255).toString(16).padStart(2, '0');
function record(fn) {
  let rects = [], box = [-1e9, -1e9, 1e9, 1e9], dx = 0, dy = 0;
  const q = v => Math.round(v * 5) / 5;
  const g = makeG({
    R(x, y, w, h, c, a = 1) {
      if (a < .08 || w >= G) return; // 画面全体を光らせる・暗くするのは 案内役では使わない
      let x0 = Math.max(q(x) + dx, box[0]), y0 = Math.max(q(y) + dy, box[1]);
      const x1 = Math.min(q(x) + dx + q(w), box[2]), y1 = Math.min(q(y) + dy + q(h), box[3]);
      if (x1 - x0 < .1 || y1 - y0 < .1) return;
      rects.push([a < 1 ? c + hex2(a) : c, q(x0 + RX), q(y0 + RY), q(x1 - x0), q(y1 - y0)]);
    },
    T() {}, // 小さい案内役では 文字は出さない
    clip(x, y, w, h, f) { const b = box; box = [Math.max(b[0], x), Math.max(b[1], y), Math.min(b[2], x + w), Math.min(b[3], y + h)]; f(); box = b; },
    shake(sx, sy, f) { dx += Math.round(sx); dy += Math.round(sy); f(); dx -= Math.round(sx); dy -= Math.round(sy); },
  });
  fn(g);
  // 横にとなり合う同じ色のマスを 1 つにまとめて、絵を軽くする
  const out = [];
  for (const r of rects) {
    const p = out[out.length - 1];
    if (p && p[0] === r[0] && p[2] === r[2] && p[4] === r[4] && Math.abs(p[1] + p[3] - r[1]) < .05) p[3] = q(p[3] + r[3]);
    else out.push(r);
  }
  return out;
}
// 最後は 煙でポンと 元のキャラクターにもどる
function smoke(g, k) {
  [[24, 34, 0], [16, 38, 1], [32, 38, 2], [20, 28, 3], [28, 27, 4]].forEach(([x, y, i]) =>
    g.disc(x + (x - 24) * k * .3, y - k * 3, Math.round(3 + Math.sin(k * Math.PI) * 4), i % 2 ? '#cfcfd8' : '#9a98a8', 1 - k * .8));
}
function toMoves(list, kind, label) {
  return list.map(p => {

    else R(K, x + lk, ey, 2, 2);
  };
  const e = o.eyes || 'open';
  eye(6, e === 'wink' ? 'closed' : e); eye(16, e === 'wink' ? 'open' : e);
  if (o.cheek) { R(CHEEK, 5, ey + 3, 2, 1); R(CHEEK, 17, ey + 3, 2, 1); }
  if (o.mouth === 'open') R(K, 11, ey + 4, 2, 2);
  else if (o.mouth === 'closed') R(K, 11, ey + 5, 2, 1);
  if (o.cap) {
    R(WHITE, 3, top - 1, 18, 2); R(CAP, 5, top - 3, 14, 2); R(CAP, 8, top - 5, 11, 2); R(CAP, 12, top - 7, 9, 2);
    R(CAP, 19, top - 6, 3, 2); R(WHITE, 22, top - 5, 2, 2);

  }
  (o.extra || []).forEach(q => r.push(q));
  return r;
}

function onigiri(x, y, bite) {
  if (bite >= 3) return [[RICE, x+2, y+3, 2, 1], [NORI, x+2, y+4, 2, 1]];
  if (bite === 2) return [[RICE, x+3, y+2, 3, 1], [RICE, x+5, y+3, 1, 1], [NORI, x+3, y+3, 2, 2]];
  if (bite === 1) return [[RICE, x+3, y+1, 2, 1], [RICE, x+1, y+2, 5, 2], [NORI, x+1, y+3, 4, 2]];
  return [[RICE, x+2, y, 2, 1], [RICE, x+1, y+1, 4, 1], [RICE, x, y+2, 6, 2], [NORI, x+1, y+3, 4, 2]];
}

  if(!o.ha) { arm(0,o.l); arm(1,o.r); } // hide arms flag
  return r.concat(o.ex||[]);
}

  const dx=o.dx||0, dy=o.dy||0, sq=o.sq||0, r=[];
  const R=(c,x,y,w,h)=>r.push([c,x+dx,y+dy,w,h]);

  if(o.cheek){ R(CHEEK,5,sq+5,2,1); R(CHEEK,17,sq+5,2,1); }

  return r.concat(o.ex||[]);
}

<script>
// =============================================================
// キャラクターの自己紹介（cc-intro）
//   左上の Claude Code（オレンジ）と GitHub のマークをタップすると、それぞれが1文字ずつ「ピッ」と鳴らしながら自己紹介する。
//   公式ページは自己紹介の画面の「公式ページを見る」から開く
// =============================================================
(function ccIntro() {
  const APP = '勤務指定表';
  const INTRO = {
    cc: {
      name: 'Claude Code（クロード・コード）',
      link: 'https://claude.com/claude-code',
      text: 'やあ！ ぼくは Claude Code。\nAnthropic が作った AI だよ。\n話しかけるだけで アプリを\n作ったり 直したり できるんだ。\nこの' + APP + 'も\nいっしょに作ったよ！'
    },
    gh: {
      name: 'GitHub（ギットハブ）',
      link: 'https://github.com/aaiuioo-maker/kinmu-shitei',
      text: 'ぼくは GitHub の オクトキャット。\nプログラムを しまっておく\n大きな本だな だよ。\n' + APP + 'は ここに置いてあって\nスマホからも 開けるんだ。'
    }
  };
  const overlay = document.getElementById('ccIntro');
  const box = overlay && overlay.querySelector('.ccx-box');
  if (!box) return;
  const msg = box.querySelector('.ccx-msg');
  let full = '', pos = 0, timer = null, ac = null;

  // 効果音（このアプリの音とは別に、自己紹介だけで使う）
  function tone(freq, dur, vol) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'square'; o.frequency.setValueAtTime(freq, ac.currentTime);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur + 0.02);
    } catch (e) {}
  }
  const blip = () => tone(1100, 0.03, 0.045);

  function open(who) {
    const d = INTRO[who];
    box.dataset.who = who;
    box.querySelector('.ccx-name').textContent = d.name;
    box.querySelector('.ccx-link').href = d.link;
    full = d.text; pos = 0; msg.textContent = '';
    overlay.classList.add('show');
    tone(1200, 0.05, 0.04);
    clearTimeout(timer); timer = setTimeout(type, 300);
  }
  function type() {
    if (pos >= full.length) return;
    pos++; msg.textContent = full.slice(0, pos);
    const c = full.charAt(pos - 1);
    if (c !== ' ' && c !== '\n' && c !== '…') blip();
    timer = setTimeout(type, c === '\n' ? 300 : 45);
  }
  // 文字の途中でタップしたら、残りを一気に出す
  msg.addEventListener('click', () => { clearTimeout(timer); pos = full.length; msg.textContent = full; });
  function close() { clearTimeout(timer); overlay.classList.remove('show'); tone(440, 0.08, 0.04); }
  box.querySelector('.ccx-close').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  document.querySelectorAll('.cc-mascot').forEach(el => {
    if (el.closest('#ccIntro')) return;
    el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); open('cc'); });
  });
  // GitHub のマークは、くるっと1回転してから自己紹介
  document.querySelectorAll('.gh-mascot').forEach(el => {
    if (el.closest('#ccIntro')) return;
    el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setTimeout(() => open('gh'), 450); });
  });
})();
</script>

<script>
// =============================================================
// 夜（0時〜朝7時）にオレンジのキャラクターをタップすると、自己紹介の画面に「おこす」ボタンが出る。
//   押すと、アプリを閉じるまで起きて、ランダムな動きをする（閉じて開き直すと、また寝る）
// =============================================================
(function ccWake() {
  window.CC_AWAKE = false;
  const sleeping = () => new Date().getHours() < 7 && !window.CC_AWAKE;
  const intro = document.getElementById('ccIntro');
  if (intro) {
    const box = intro.querySelector('.ccx-box'), btn = intro.querySelector('.ccx-wake');
    if (!box || !btn) return;
    const sync = () => { btn.hidden = !(intro.classList.contains('show') && box.dataset.who === 'cc' && sleeping()); };
    new MutationObserver(sync).observe(intro, { attributes: true, subtree: true, attributeFilter: ['class', 'data-who'] });
    btn.addEventListener('click', () => { window.CC_AWAKE = true; btn.hidden = true; intro.querySelector('.ccx-close').click(); });
    return;
  }
  // 自己紹介の画面がないアプリ：寝ているときにタップすると、小さな「おこす」画面を出す
  const a = document.querySelector('.cc-mascot');
  if (!a) return;
  const pop = document.createElement('div');
  pop.id = 'ccWakePop'; pop.hidden = true;
  pop.innerHTML = '<div class="ccw-box"><p>オレンジのキャラクターは、いま ねています… zzz</p>' +
    '<div class="ccw-btns"><button type="button" class="ccw-wake">おこす</button><button type="button" class="ccw-close">とじる</button></div></div>';
  document.body.appendChild(pop);
  a.addEventListener('click', e => { if (!sleeping()) return; e.preventDefault(); pop.hidden = false; });
  pop.querySelector('.ccw-wake').addEventListener('click', () => { window.CC_AWAKE = true; pop.hidden = true; });
  pop.querySelector('.ccw-close').addEventListener('click', () => { pop.hidden = true; });
  pop.addEventListener('click', e => { if (e.target === pop) pop.hidden = true; });
})();
</script>
<script>
// =============================================================
// 自己紹介の画面（オレンジのキャラクター）の「動画を見る」ボタン：2つの動画からランダムに1つを流す
//   movies/block-day.mp4（昼のブロックの世界）・movies/block-night.mp4（夜のブロックの世界）
// =============================================================
(function ccMovie() {
  const intro = document.getElementById('ccIntro'); if (!intro) return;
  const box = intro.querySelector('.ccx-box'), btn = intro.querySelector('.ccx-movie'); if (!box || !btn) return;
  const MOVIES = ['movies/block-day.mp4', 'movies/block-night.mp4'];
  let last = -1;
  const pop = document.createElement('div'); pop.id = 'ccMovie'; pop.hidden = true;
  pop.innerHTML = '<div class="ccm-box"><video playsinline preload="none" disablepictureinpicture></video><button type="button" class="ccm-close">とじる</button></div>';
  document.body.appendChild(pop);
  const video = pop.querySelector('video');
  const close = () => { video.pause(); pop.hidden = true; };
  // 「動画を見る」はオレンジのキャラクターの自己紹介のときだけ出す（GitHub のときは出さない）
  const sync = () => { btn.hidden = !(intro.classList.contains('show') && box.dataset.who === 'cc'); };
  new MutationObserver(sync).observe(intro, { attributes: true, subtree: true, attributeFilter: ['class', 'data-who'] });
  btn.addEventListener('click', () => {
    let i; do { i = Math.floor(Math.random() * MOVIES.length); } while (i === last && MOVIES.length > 1);   // 前と同じ動画は続けない
    last = i; video.src = MOVIES[i]; pop.hidden = false; video.currentTime = 0; video.play().catch(() => {});
  });
  pop.querySelector('.ccm-close').addEventListener('click', close);
  pop.addEventListener('click', e => { if (e.target === pop) close(); });
  video.addEventListener('ended', close);
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勤務指定表 - 伏見郵便局 集荷班</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  body { font-family: "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; font-size: 12px; }

  /* === オープニング（よく行く場所と同じ作り。背景はアイコンと同じ紺色。白いカードの上でパソコンを打つキャラクターと GitHub のマーク） === */
  .op{position:fixed;inset:0;z-index:11000;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#1a2a4a,#0d1a33);color:#fff;cursor:pointer;transition:opacity .5s,visibility .5s;overflow:auto;font-family:-apple-system,'Helvetica Neue',sans-serif}
  .op.hide{opacity:0;visibility:hidden}
  .op-in{position:relative;z-index:1;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  .op-sub{margin:0;font-size:.85rem;font-weight:700;background:#1a6ed8;color:#fff;border-radius:999px;padding:3px 14px;animation:op-drop .5s both}
  .op-t{margin:0;display:flex;flex-direction:column;line-height:1.15;color:#fff}
  .op-t span{font-size:2.1rem;font-weight:400;animation:op-drop .6s .1s both}
  .op-t b{font-size:3.2rem;letter-spacing:.1em;font-weight:400;animation:op-drop .6s .25s both}
  .op-chars{display:flex;align-items:flex-end;justify-content:center;gap:26px;background:#fff;border-radius:18px;padding:16px 24px 10px;box-shadow:0 4px 14px rgba(0,0,0,.08);border:.5px solid rgba(0,0,0,.08);animation:op-rise .6s .4s both}
  .op-c{display:flex;flex-direction:column;align-items:center;gap:6px;font:10px -apple-system,"Segoe UI",sans-serif;letter-spacing:.05em}
  .op-cc{width:102px;height:69px;shape-rendering:crispEdges;overflow:visible}
  .op-c.cc span{color:#d97757}
  .op-gh{--gh-disc:#24292f;--gh-cat:#fff;color:#57606a}
  .op-gh svg{width:48px;height:48px;overflow:visible}   /* オレンジの体（頭から足先まで48px）と高さをそろえる */
  .op-gh.spin .gh-all{animation:gh-spin .7s cubic-bezier(.34,1.4,.64,1)}
  .op-hello{margin:0;font-size:1rem;font-weight:700;color:#dce6ff;animation:op-rise .6s .55s both}
  .op-tip{margin:0;font-size:.85rem;line-height:1.5;min-height:3em;background:#fff;color:#444;border:.5px solid rgba(0,0,0,.08);border-radius:10px;padding:8px 12px;animation:op-rise .6s .65s both}
  .op-bar{width:72%;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
  .op-bar i{display:block;height:100%;width:0;background:#fff;transition:width 1.5s linear}
  .op-go{font:inherit;font-weight:700;font-size:1.05rem;background:#1a6ed8;color:#fff;border:0;border-radius:999px;padding:12px 30px;box-shadow:0 4px 0 rgba(0,0,0,.15);animation:op-pulse 1.4s ease-in-out infinite;cursor:pointer}
  .op-go.busy{animation:none;opacity:.85}
  @keyframes op-drop{from{transform:translateY(-24px);opacity:0}}
  @keyframes op-rise{from{transform:translateY(20px);opacity:0}}
  @keyframes op-pulse{50%{transform:scale(1.06)}}
  /* === Claude Code のキャラクター（タイトルの左） === */
  /* 左：キャラクターとGitHubのマーク／右：タイトル（少し間をあけて左寄せ） */
  .title-area .title-row1 { display: grid; grid-template-columns: 84px 1fr; align-items: center; }
  .title-area .title-row1 h2 { text-align: left; padding-left: 12px; font-size: 18px; font-weight: normal; }
  .cc-mascot {
    position: relative;
    width: 46px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-decoration: none;
  }
  .cc-mascot svg { width: 51px; height: 34.5px; shape-rendering: crispEdges; overflow: visible; }  /* 右の約15pxはノートパソコンが出る場所。中の絵は ccTyping が描く */
  .cc-mascot .cc-label {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 7px;
    letter-spacing: 0.05em;
    color: #d97757;
    opacity: 0.8;
    white-space: nowrap;
  }
  /* ときどきまばたき */
  /* === GitHub のマーク（オレンジのキャラクターの右） ===
     横には動かず、その場で：タコの足をゆらゆら・ときどき首をかしげる・ときどき目をパチッ。タップすると1回転 */
  .logo-pair { display: flex; align-items: flex-end; gap: 4px; }
  .gh-mascot { --gh-disc: #24292f; --gh-cat: #ffffff; --gh-text: #57606a; }   /* 白い枠の上なので、黒い丸に白いネコ */
  .gh-wrap { width: 34px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; }
  .gh-mascot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 46px; gap: 3px; text-decoration: none; }
  .gh-mascot svg { width: 24px; height: 24px; overflow: visible; }   /* オレンジのキャラクター（足先まで24px）と上下の端をそろえる */
  .gh-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: var(--gh-text); opacity: 0.8; white-space: nowrap; }
  .gh-disc, .gh-dot { fill: var(--gh-disc); }
  .gh-cat { fill: var(--gh-cat); }
  .gh-tail-line { fill: none; stroke: var(--gh-cat); stroke-width: 0.8; stroke-linecap: round; }
  .gh-all { transform-box: view-box; transform-origin: 8px 8px; }
  .gh-head { transform-box: view-box; transform-origin: 8px 10.4px; animation: gh-tilt 5s ease-in-out infinite; }
  .gh-tail { transform-box: view-box; transform-origin: 6.5px 12.35px; animation: gh-wag 1.4s ease-in-out infinite alternate; }
  /* 目はふだん見せない（ロゴと同じ顔なし）。ときどき一瞬だけ開いてパチッ */
  .gh-eyes { fill: var(--gh-disc); transform-box: fill-box; transform-origin: center; animation: gh-wink 6s 2s infinite; }
  .gh-mascot.spin .gh-all { animation: gh-spin 0.7s cubic-bezier(0.34,1.4,0.64,1); }
  /* 2つのロゴの並びをそろえる：下の文字（Claude Code / GitHub）を同じ高さにし、絵はその上に下ぞろえで置く */
  .cc-mascot { height: 46px; justify-content: flex-end; }
  @keyframes gh-tilt { 0%,60%,100% { transform: rotate(0); } 68% { transform: rotate(-9deg); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(6deg); } 92% { transform: rotate(0); } }
  @keyframes gh-wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
  @keyframes gh-wink { 0%,88%,100% { transform: scaleY(0); } 90%,95% { transform: scaleY(1); } }
  @keyframes gh-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
  #appContent { display: none; padding: 10px; }
  .title-area { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .title-row1 { display: flex; align-items: center; }
  h2 { color: #333; font-size: 15px; margin: 0; white-space: nowrap; }
  .title-row2 { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .title-sep { color: #bbb; font-size: 13px; flex-shrink: 0; }
  .date-setter-inline { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .date-setter-inline label { font-size: 11px; color: #888; white-space: nowrap; }
  .date-setter-inline input { border: 1px solid #ccc; border-radius: 4px; padding: 2px 4px; font-size: 12px; width: 116px; }
  .period { font-size: 11px; color: #d0021b; font-weight: bold; white-space: nowrap; }
  .btn-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
  .btn-group button { padding: 9px 2px; font-size: 11px; width: 100%; }
  .file-save-btn { background-color: #5ac8fa; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
  .file-load-btn { background-color: #ff9500; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
  .save-btn { background-color: #007aff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
  .save-img-direct-btn { background-color: #34c759; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
  .ai-btn { background-color: #af52de; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
  /* 一括入力ポップアップ */
  #bulkModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9000; justify-content:center; align-items:center; }
  .bulk-content { background:#fff; border-radius:14px; padding:20px 16px; width:280px; box-shadow:0 8px 32px rgba(0,0,0,0.25); }
  .bulk-name { font-size:15px; font-weight:bold; text-align:center; margin-bottom:14px; color:#333; }
  .bulk-hint { font-size:11px; color:#888; text-align:center; margin-bottom:12px; }
  .bulk-btns { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  .bulk-num { padding:12px 0; font-size:16px; font-weight:900; border:none; border-radius:8px; cursor:pointer; -webkit-text-stroke:0.8px #000; }
  .bulk-num-1{background:#e8f0ff;color:#007aff} .bulk-num-2{background:#ffe8e8;color:#ff3b30}
  .bulk-num-3{background:#e8f7ed;color:#34c759} .bulk-num-4{background:#f3eaff;color:#9370DB}
  .bulk-num-5{background:#fff3e0;color:#ff9500} .bulk-num-6{background:#e5f6ff;color:#32ade6}
  .bulk-num-7{background:#fffde0;color:#b8a000} .bulk-cancel{background:#f0f0f0;color:#666;font-size:13px;font-weight:bold;padding:12px 0;border:none;border-radius:8px;cursor:pointer;grid-column:span 4;}
  .capture-wrapper { background-color: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .table-container { width: 100%; overflow-x: auto; background-color: white; border-left: 1px solid #777; scroll-behavior: smooth; }
  table { border-collapse: collapse; width: max-content; font-size: 10px; border-right: 1px solid #777; background-color: white; }
  th, td { border: 1px solid #777; padding: 0; text-align: center; vertical-align: middle; white-space: nowrap; height: 24px; box-sizing: border-box; }
  th { background-color: #e2e8f0; padding: 1px 0; font-weight: normal; font-size: 10px; }
  .date-col { width: 34px; min-width: 34px; }
  .sticky-col1 { position: sticky; left: 0; z-index: 2; background-color: #f8fafc; width: 68px; min-width: 68px; border-left: none !important; box-shadow: inset 1px 0 0 #777, inset -1px 0 0 #777; font-size: 10px; }
  .sticky-col2 { position: sticky; left: 68px; z-index: 2; background-color: #f8fafc; width: 30px; min-width: 30px; font-size: 9px; box-shadow: inset -1px 0 0 #777; }
  th.sticky-col1, th.sticky-col2 { z-index: 3; background-color: #cbd5e1; font-weight: bold; }
  .text-red { color: #ff0000 !important; font-weight: bold; }
  .text-darkgreen { color: #006400 !important; font-weight: bold; }
  .text-purple { color: #800080 !important; font-weight: bold; }
  .today-header { border-bottom: 2px solid #34c759 !important; background-color: rgba(52,199,89,0.25) !important; }
  .today-col { background-color: rgba(52,199,89,0.12) !important; }
  select { width: 100%; height: 100%; border: none; outline: none; text-align: center; text-align-last: center; font-size: 9px; background-color: transparent; appearance: none; color: #000; cursor: pointer; }
  td.two-line { position: relative; }
  .two-line-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; line-height: 1.05; }
  .two-line-overlay span { font-size: 8px; font-weight: bold; color: #000; }
  .bg-holiday { background-color: #ffff00 !important; }
  .bg-trip { background-color: #ffccdd !important; }
  .row-shitei td { background-color: #ffffff; }
  .row-henkou td { background-color: #fafafa; border-bottom: 2px solid #777; }
  .row-shitei td.sticky-col1 { border-bottom: 2px solid #777; }
  .outlined-text { font-size: 18px !important; font-weight: 900 !important; -webkit-text-stroke: 1.0px #000; padding-top: 4px !important; }
  .color-1{color:#007aff!important} .color-2{color:#ff3b30!important} .color-3{color:#34c759!important}
  .color-4{color:#9370DB!important} .color-5{color:#ff9500!important} .color-6{color:#32ade6!important} .color-7{color:#ffd600!important}
  .color-mc { color:#ff2d00!important; font-size:12px!important; font-weight:800!important; }
  .color-masu { color:#003087!important; font-size:12px!important; font-weight:800!important; }
  .color-kon  { color:#e00!important;   font-size:12px!important; font-weight:800!important; }
  .color-tsuku { color:#333!important;  font-size:12px!important; font-weight:800!important; }
  .color-kyuki { color:#e00!important;  font-size:12px!important; font-weight:800!important; }
  #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; color: white; justify-content: center; align-items: center; flex-direction: column; }
  #loadingOverlay .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  #aiModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
  .ai-modal-content { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
  .ai-modal-content h3 { margin: 0 0 5px 0; font-size: 15px; }
  .ai-modal-content textarea { width: 100%; height: 250px; font-family: monospace; font-size: 11px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  .ai-modal-content .modal-btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px; }
  .ai-modal-content button { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
  .btn-apply { background: #34c759; color: white; }
  .btn-close { background: #e5e5ea; color: #333; }
  .week-nav { display: flex; gap: 3px; flex-shrink: 0; }
  .week-btn { background-color: #ff6b00; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; padding: 4px 7px; flex-shrink: 0; }
  .week-btn:active { opacity: 0.75; }
  .today-btn { background-color: #34c759; }
</style>
</head>
<body>

  <!-- オープニング：タップすると音が鳴って、いつもの画面に切りかわる（よく行く場所と同じ作り） -->
  <div class="op" id="op" role="dialog" aria-label="オープニング">
    <div class="op-in">
      <p class="op-sub">伏見郵便局 集荷班</p>
      <h2 class="op-t"><span>4週間の</span><b>勤務指定表</b></h2>
      <div class="op-chars">
        <div class="op-c cc"><svg class="cc-anim op-cc" viewBox="0 -7 34 23" data-skip="60" aria-hidden="true"></svg><span>Claude Code</span></div>
        <div class="op-c op-gh">
<svg viewBox="0 0 16 16" aria-hidden="true">
<defs><clipPath id="ghClipOp"><circle cx="8" cy="8" r="8"/></clipPath></defs>
<g class="gh-all">
<circle class="gh-disc" cx="8" cy="8" r="8"/>
<g clip-path="url(#ghClipOp)">
<!-- 体（首から下。丸の下へつながる） -->
<path class="gh-cat" d="M6.75 10.3 C6.45 10.7 6.3 11.2 6.3 11.8 L6.3 15.1 Q6.3 15.6 6.8 15.6 L9.2 15.6 Q9.7 15.6 9.7 15.1 L9.7 11.8 C9.7 11.2 9.55 10.7 9.25 10.3 Z"/>
<!-- 頭と耳（首を中心にかしげる） -->
<g class="gh-head">
<path class="gh-cat" d="M4.15 4.75 C3.85 3.85 3.95 2.85 4.3 2.1 C4.3 2.1 5.05 1.95 6.35 2.9 C6.9 2.75 7.45 2.68 8 2.68 C8.55 2.68 9.1 2.75 9.65 2.9 C10.95 1.95 11.7 2.1 11.7 2.1 C12.05 2.85 12.15 3.85 11.85 4.75 C12.4 5.3 12.75 6.0 12.75 6.95 C12.75 9.75 10.95 10.45 8 10.55 C5.05 10.45 3.25 9.75 3.25 6.95 C3.25 6.0 3.6 5.3 4.15 4.75 Z"/>
<!-- まばたき用の目（ふだんは閉じていて、ときどきパチッと開く） -->
<rect class="gh-eyes" x="5.5" y="6.1" width="1" height="1.5" rx="0.5"/>
<rect class="gh-eyes" x="9.5" y="6.1" width="1" height="1.5" rx="0.5"/>
</g>
<!-- タコの足（付け根を中心にゆらゆら） -->
<g class="gh-tail">
<path class="gh-tail-line" d="M6.5 12.35 C5.3 12.55 4.65 12.0 4.25 11.25 C3.95 10.7 3.6 10.35 3.0 10.25"/>
<circle class="gh-dot" cx="5.5" cy="12.2" r="0.17"/>
<circle class="gh-dot" cx="4.75" cy="11.75" r="0.17"/>
<circle class="gh-dot" cx="4.25" cy="11.05" r="0.17"/>
<circle class="gh-dot" cx="3.7" cy="10.5" r="0.17"/>
</g>
</g>
</g>
</svg>
          <span>GitHub</span>
        </div>
      </div>
      <p class="op-hello" id="ophello"></p>
      <p class="op-tip" id="optip"></p>
      <div class="op-bar"><i id="opbar"></i></div>
      <button class="op-go" id="opgo" type="button">タップしてはじめる</button>
    </div>
  </div>

  <div id="appContent">
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div style="font-size:16px;font-weight:bold;margin-bottom:5px;">📸 画像を生成中...</div>
      <div style="font-size:12px;color:#ddd;">※Safari以外のアプリだとフリーズする場合があります</div>
    </div>

    <div id="captureArea" class="capture-wrapper">
      <div class="title-area">
        <!-- 1段目：タイトル -->
        <div class="title-row1">
          <div class="logo-pair">
          <a class="cc-mascot no-capture" href="https://claude.com/claude-code" target="_blank" rel="noopener" title="Claude Code で作成" aria-label="Claude Code で作成">
            <!-- 1マス＝1ドットのドット絵（横12×縦8マス：体6段＋足2段。元のアイコンと同じ比率） -->
            <svg class="cc-anim" viewBox="0 -7 34 23" aria-hidden="true"></svg>
            <span class="cc-label">Claude Code</span>
          </a>
          <div class="gh-wrap">
            <a class="gh-mascot no-capture" href="https://github.com/aaiuioo-maker/kinmu-shitei" target="_blank" rel="noopener" title="GitHub で公開" aria-label="GitHub で公開">
              <!-- GitHub のマーク（丸の中のネコ＋左に巻いたタコの足）。部品ごとに分けて、それぞれ動かしている -->
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <defs><clipPath id="ghClip"><circle cx="8" cy="8" r="8"/></clipPath></defs>
                <g class="gh-all">
                  <circle class="gh-disc" cx="8" cy="8" r="8"/>
                  <g clip-path="url(#ghClip)">
                    <!-- 体（首から下。丸の下へつながる） -->
                    <path class="gh-cat" d="M6.75 10.3 C6.45 10.7 6.3 11.2 6.3 11.8 L6.3 15.1 Q6.3 15.6 6.8 15.6 L9.2 15.6 Q9.7 15.6 9.7 15.1 L9.7 11.8 C9.7 11.2 9.55 10.7 9.25 10.3 Z"/>
                    <!-- 頭と耳（首を中心にかしげる） -->
                    <g class="gh-head">
                      <path class="gh-cat" d="M4.15 4.75 C3.85 3.85 3.95 2.85 4.3 2.1 C4.3 2.1 5.05 1.95 6.35 2.9 C6.9 2.75 7.45 2.68 8 2.68 C8.55 2.68 9.1 2.75 9.65 2.9 C10.95 1.95 11.7 2.1 11.7 2.1 C12.05 2.85 12.15 3.85 11.85 4.75 C12.4 5.3 12.75 6.0 12.75 6.95 C12.75 9.75 10.95 10.45 8 10.55 C5.05 10.45 3.25 9.75 3.25 6.95 C3.25 6.0 3.6 5.3 4.15 4.75 Z"/>
                      <!-- まばたき用の目（ふだんは閉じていて、ときどきパチッと開く） -->
                      <rect class="gh-eyes" x="5.5" y="6.1" width="1" height="1.5" rx="0.5"/>
                      <rect class="gh-eyes" x="9.5" y="6.1" width="1" height="1.5" rx="0.5"/>
                    </g>
                    <!-- タコの足（付け根を中心にゆらゆら） -->

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    const keepAudioAlive = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
    document.addEventListener('touchstart', keepAudioAlive, { passive: true });
    document.addEventListener('click',      keepAudioAlive, { passive: true });
    document.addEventListener('scroll',     keepAudioAlive, { passive: true, capture: true });

    // ── オープニング（よく行く場所と同じ作り）──
    //   1回目のタップ：ピコッ → カタカタ（キーボード）→ ピロリン と鳴り、GitHub のマークが回って、2.3秒後にいつもの画面へ
    //   鳴っている間にもう一度タップすると、すぐいつもの画面へ
    function opTone(f, t, d, v) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(1e-4, t);
      g.gain.exponentialRampToValueAtTime(v, t + .005);
      g.gain.exponentialRampToValueAtTime(1e-4, t + d);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + .02);
    }
    // カタッ（キーボードを打つ音）。d 秒あとに鳴らす
    function opKey(d) {
      const t = audioCtx.currentTime + .01 + d;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 1700 + Math.random() * 500;
      g.gain.setValueAtTime(.035, t); g.gain.exponentialRampToValueAtTime(.001, t + .025);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .035);
    }
    (function opening() {
      const op = document.getElementById('op');
      if (!op) return;
      const h = new Date().getHours();
      document.getElementById('ophello').textContent = h < 5 ? '夜おそくまで、おつかれさまです' : h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'おつかれさまです';
      const TIPS = [
        '名前をタップすると、黄色以外のコース欄をまとめて入力できます',
        '「◀ 前」「次 ▶」で4週間ずつ移動します',
        '「今日」を押すと、今日から始まる表に戻ります',
        '「📷画像」で、表を画像にしてLINEなどに送れます',
        '「⬆️保存」でバックアップ、「⬇️復元」で読み込みができます',
        'コースが「出張」の日はピンク、休みの日は黄色になります'];
      document.getElementById('optip').textContent = 'ひとこと：' + TIPS[Math.floor(Math.random() * TIPS.length)];
      let started = false;
      function close() {
        if (op.classList.contains('hide')) return;
        op.classList.add('hide');
        document.getElementById('appContent').style.display = 'block';
        setTimeout(() => op.remove(), 600);
      }
      op.addEventListener('click', () => {
        if (started) { close(); return; }
        started = true;
        try {
          initAudio();
          const t = audioCtx.currentTime + .01;
          opTone(1046, t, .05, .06); opTone(1318, t + .06, .05, .06);                          // ピコッ
          for (let i = 0; i < 14; i++) opKey(.15 + i * .095 + Math.random() * .03);            // カタカタ…
          [1318.5, 1568, 2093].forEach((f, i) => opTone(f, t + 1.65 + i * .06, i === 2 ? .13 : .05, .11)); // ピロリン
        } catch (_) {}
        const go = document.getElementById('opgo');
        go.textContent = '準備中…'; go.classList.add('busy');
        op.querySelector('.op-gh').classList.add('spin');                                      // GitHub のマークがくるっと回る
        requestAnimationFrame(() => { document.getElementById('opbar').style.width = '100%'; });
        setTimeout(close, 2300);
      });
    })();

    /* ── ファミコン音源ヘルパー ── */

    // duty比指定の矩形波（ファミコン実機: 12.5 / 25 / 50 / 75%）
    function _sq(c, freq, t, dur, vol, duty) {
      const N = 32, real = new Float32Array(N), imag = new Float32Array(N);
      for (let k = 1; k < N; k++) imag[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
      const wave = c.createPeriodicWave(real, imag, { disableNormalization: false });
      const osc = c.createOscillator(); osc.setPeriodicWave(wave);
      osc.frequency.setValueAtTime(freq, t);
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.008);
      g.gain.setValueAtTime(vol, t + dur * 0.78);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    // 三角波（ch3 ベース用）
    function _tri(c, freq, t, dur, vol) {
      const osc = c.createOscillator(); osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.setValueAtTime(vol, t + dur * 0.85);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    // ノイズ（ch4 打楽器）
    function _nz(c, t, dur, vol, band) {
      const n = Math.ceil(c.sampleRate * dur);
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      let lp = 0;
      for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; lp = 0.25 * w + 0.75 * lp; d[i] = lp; }
      const src = c.createBufferSource(); src.buffer = buf;
      const flt = c.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = band; flt.Q.value = 0.7;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + dur + 0.02);
    }

    /* ══════════════════════════════════════════
       ★ オープニング音：帰局後作業アプリ と同じシーケンス
       ── C5→E5→G5→C6→G5→A5→C6 の7音
    ══════════════════════════════════════════ */
    function playFanfare() {
      initAudio();
      if (!audioCtx) return;
      const c = audioCtx;
      const seq = [
        [523, 0.12],
        [659, 0.12],
        [784, 0.12],
        [1047, 0.20],
        [784, 0.08],
        [880, 0.08],
        [1047, 0.30],
      ];
      let t = c.currentTime + 0.05;
      seq.forEach(([freq, dur]) => {
        const o = c.createOscillator();
        const g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'square';
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur);
        t += dur + 0.02;
      });
    }

    /* ── その他SE ── */

    function playSelect() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playSave() {
      initAudio();
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(659.25,  t);
      osc.frequency.setValueAtTime(880.00,  t + 0.1);
      osc.frequency.setValueAtTime(1318.51, t + 0.2);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.setValueAtTime(0.09, t + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(t + 0.5);
    }

    function playTick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.02);
    }

    let lastScrollLeft = 0;
    const container = document.getElementById('mainContainer');
    container.addEventListener('scroll', () => {
      initAudio();
      if (Math.abs(container.scrollLeft - lastScrollLeft) > 35) {
        playTick();
        lastScrollLeft = container.scrollLeft;
      }
    });

    /* ── データ・テーブル ── */

    const holidays = ["2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23"];
    const names = ["栗田 昌俊","岡崎 安浩","菅原 みづほ","倉持 祥","田中 勝也","吹田 将基","住友 正","北山 圭介","山田 佳之","田嶋 治","北村 学","三輪 晟也",""];
    const shiftsShitei = ["","週休","非番","祝日","日４","日５","日６","中１","中２","中３","中４","夜１"];
    const shiftsCourse = ["","営業","承認欠勤","1","2","3","4","5","6","7","年休","計年","冬期","夏期","出張","休希","MC","支部","マス","コン","通区"];

    // 黄色表示（休み扱い）になる値
    const HOLIDAY_SHITEI = ["週休","非番","祝日"];
    const HOLIDAY_COURSE = ["年休","計年","冬期","夏期","承認欠勤"];

    const MASTER_STORE_KEY = 'Fushimi_Master_Data';
    const LAST_DATE_KEY    = 'Fushimi_Last_Date_Value';
    let currentDates = [];

    function updateTableDates() {
      const startVal = document.getElementById("startDate").value;
      if (!startVal) return;
      localStorage.setItem(LAST_DATE_KEY, startVal);
      const startDate = new Date(startVal);
      currentDates = [];
      let d = new Date(startDate);
      for (let i = 0; i < 28; i++) { currentDates.push(new Date(d)); d.setDate(d.getDate() + 1); }
      renderHeader();
      renderBody();
    }

    function renderHeader() {
      const headerTop    = document.getElementById("headerRowTop");
      const headerBottom = document.getElementById("headerRowBottom");
      while (headerTop.cells.length > 2) headerTop.deleteCell(2);
      headerBottom.innerHTML = "";
      const daysArr  = ["日","月","火","水","木","金","土"];
      const todayStr = new Date().toLocaleDateString('sv-SE');
      currentDates.forEach(date => {
        const dateStr = date.toLocaleDateString('sv-SE');
        const thDay  = document.createElement("th"); thDay.className  = "date-col";
        const thWeek = document.createElement("th"); thWeek.className = "date-col";
        thWeek.textContent = `(${daysArr[date.getDay()]})`;
        if (dateStr === todayStr) {
          thDay.classList.add("today-header"); thWeek.classList.add("today-header");
          thDay.innerHTML = `<div style="font-size:7px;color:red;">今日</div>${date.getMonth()+1}/${date.getDate()}`;
        } else {
          thDay.textContent = `${date.getMonth()+1}/${date.getDate()}`;
        }
        if      (holidays.includes(dateStr)) { thDay.className += " text-purple";    thWeek.className += " text-purple"; }
        else if (date.getDay() === 0)        { thDay.className += " text-red";       thWeek.className += " text-red"; }
        else if (date.getDay() === 6)        { thDay.className += " text-darkgreen"; thWeek.className += " text-darkgreen"; }
        headerTop.appendChild(thDay); headerBottom.appendChild(thWeek);
      });
    }

    function renderBody() {
      const tbody    = document.getElementById("tableBody");
      tbody.innerHTML = "";
      const master   = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
      const todayStr = new Date().toLocaleDateString('sv-SE');
      names.forEach(name => {
        let tr1 = document.createElement("tr"); tr1.className = "row-shitei";
        let tdName  = document.createElement("td"); tdName.className  = "sticky-col1"; tdName.rowSpan = 2; tdName.textContent = name;
        if (name) { tdName.style.cursor = "pointer"; tdName.title = "タップで一括入力"; tdName.addEventListener("click", () => openBulkModal(name)); }
        let tdType1 = document.createElement("td"); tdType1.className = "sticky-col2"; tdType1.textContent = "指定";
        let tr2 = document.createElement("tr"); tr2.className = "row-henkou";
        let tdType2 = document.createElement("td"); tdType2.className = "sticky-col2"; tdType2.textContent = "コース";
        if (name === "住友 正") {
          tdName.style.backgroundColor  = "#e8f7fc";
          tdType1.style.backgroundColor = "#e8f7fc";
          tdType2.style.backgroundColor = "#e8f7fc";
        }
        tr1.appendChild(tdName); tr1.appendChild(tdType1); tr2.appendChild(tdType2);
        currentDates.forEach(date => {
          const dateStr = date.toLocaleDateString('sv-SE');
          const data = master[`${name}_${dateStr}`] || { shitei: "", course: "" };
          const todayCls = dateStr === todayStr ? "date-col today-col" : "date-col";
          let td1 = document.createElement("td"); td1.className = todayCls;
          let sel1 = createSelect(shiftsShitei, data.shitei, name, dateStr, "shitei"); td1.appendChild(sel1); tr1.appendChild(td1);
          let td2 = document.createElement("td"); td2.className = todayCls;
          let sel2 = createSelect(shiftsCourse, data.course, name, dateStr, "course"); td2.appendChild(sel2); tr2.appendChild(td2);
          if (name === "住友 正" && dateStr !== todayStr) {
            td1.style.backgroundColor = "#e8f7fc";
            td2.style.backgroundColor = "#e8f7fc";
          }
          updateStyle(sel1, sel2, td1, td2);
        });
        tbody.appendChild(tr1); tbody.appendChild(tr2);
      });
    }

    function createSelect(opts, val, name, date, type) {
      const sel = document.createElement("select");
      sel.dataset.name = name; sel.dataset.date = date; sel.dataset.type = type;
      opts.forEach(o => {
        const opt = document.createElement("option");
        opt.value = o; opt.textContent = o;
        if (o === val) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = function() {
        playSelect();
        const tr  = this.closest('tr');
        const idx = this.parentElement.cellIndex;
        let s1, s2, t1, t2;
        if (type === "shitei") {
          s1 = this; t1 = this.parentElement;
          t2 = tr.nextElementSibling.cells[idx-1]; s2 = t2.querySelector('select');
        } else {
          s2 = this; t2 = this.parentElement;
          t1 = tr.previousElementSibling.cells[idx+1]; s1 = t1.querySelector('select');
        }
        updateStyle(s1, s2, t1, t2);
        saveSingleChange(name, date, type, this.value);
      };
      return sel;
    }

    // 「承認欠勤」を選択した時、セル内に「承認」「欠勤」の2行オーバーレイを表示する
    function updateTwoLineOverlay(t2, sel2) {
      let overlay = t2.querySelector('.two-line-overlay');
      if (sel2.value === "承認欠勤") {
        t2.classList.add('two-line');
        sel2.style.opacity = '0';
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'two-line-overlay';
          overlay.innerHTML = '<span>承認</span><span>欠勤</span>';
          t2.appendChild(overlay);
        }
        overlay.style.display = 'flex';
      } else {
        t2.classList.remove('two-line');
        sel2.style.opacity = '1';
        if (overlay) overlay.style.display = 'none';
      }
    }

    function updateStyle(s1, s2, t1, t2) {
      t1.classList.remove("bg-holiday","bg-trip"); t2.classList.remove("bg-holiday","bg-trip");
      if (s2.value === "出張") {
        t1.classList.add("bg-trip"); t2.classList.add("bg-trip");
      } else if (HOLIDAY_SHITEI.includes(s1.value) || HOLIDAY_COURSE.includes(s2.value)) {
        t1.classList.add("bg-holiday"); t2.classList.add("bg-holiday");
      }
      s2.classList.remove("outlined-text","color-1","color-2","color-3","color-4","color-5","color-6","color-7","color-mc","color-masu","color-kon","color-tsuku","color-kyuki");
      if (["MC","支部"].includes(s2.value)) {
        s2.classList.add("color-mc");
      } else if (s2.value === "マス") {
        s2.classList.add("color-masu");
      } else if (s2.value === "コン") {
        s2.classList.add("color-kon");
      } else if (s2.value === "通区") {
        s2.classList.add("color-tsuku");
      } else if (s2.value === "休希") {
        s2.classList.add("color-kyuki");
      } else if (s2.value && !["年休","計年","冬期","夏期","出張","承認欠勤","休希","営業","支部"].includes(s2.value)) {
        s2.classList.add("outlined-text", "color-" + s2.value);
      }
      updateTwoLineOverlay(t2, s2);
    }

    function saveSingleChange(name, date, type, value) {
      const master = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
      const key = `${name}_${date}`;
      if (!master[key]) master[key] = {};
      master[key][type] = value;
      localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
    }

    let bulkTargetName = "";
    function openBulkModal(name) {
      playSelect();
      bulkTargetName = name;
      document.getElementById("bulkModalName").textContent = name;
      document.getElementById("bulkModal").style.display = "flex";
    }
    function closeBulkModal() {
      document.getElementById("bulkModal").style.display = "none";
      bulkTargetName = "";
    }

    // silent=true のときは効果音・アラートを出さない

      document.querySelectorAll('select').forEach(sel => {

        if (!master[key]) master[key] = {};
        master[key][sel.dataset.type] = sel.value;
      });
      localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
      localStorage.setItem(LAST_DATE_KEY, startVal);

    function applyAIData() {
      const text = document.getElementById('aiInput').value;
      if (!text) { alert("データが入力されていません。"); return; }
      try {
        const aiData = JSON.parse(text);
        if (!aiData.startDate || !aiData.shifts) throw new Error("フォーマットが違います");

        const master    = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
        const startDate = new Date(aiData.startDate);

        // ── ① 該当期間28日間のデータを全員分クリア ──
        for (let i = 0; i < 28; i++) {
          const d = new Date(startDate);
          d.setDate(d.getDate() + i);
          const dateStr = d.toLocaleDateString('sv-SE');
          names.forEach(name => {
            const key = `${name}_${dateStr}`;
            delete master[key];
          });
        }

        // ── ② AIデータを新規書き込み ──
        aiData.shifts.forEach(staff => {
          if (staff.name === "田口 裕行") return;
          let d = new Date(startDate);
          for (let i = 0; i < staff.shitei.length; i++) {
            const dateStr = d.toLocaleDateString('sv-SE');
            const key = `${staff.name}_${dateStr}`;
            master[key] = {
              shitei: staff.shitei[i] || "",
              course: staff.course[i] || ""
            };
            d.setDate(d.getDate() + 1);
          }
        });

        localStorage.setItem(MASTER_STORE_KEY, JSON.stringify(master));
        localStorage.setItem(LAST_DATE_KEY, aiData.startDate);
        playSave();
        setTimeout(() => {
          alert("✅ 期間内データをクリアし、AIデータで新規書き込みしました！\n画面を更新します。");
          document.getElementById('aiModal').style.display = 'none';
          location.reload();

        alert("読み込みエラー: AIが作成したコードをすべて正確にコピーできているか確認してください。\n" + e.message);
      }

    function saveImageDirectly() {
      playSelect();

      loading.style.display = 'flex';

      setTimeout(() => {
        try {
          const master = JSON.parse(localStorage.getItem(MASTER_STORE_KEY)) || {};
          const daysArr = ["日","月","火","水","木","金","土"];
          const todayStr = new Date().toLocaleDateString('sv-SE');
          const nameW=62, typeW=26, dateW=30, rowH=22;
          const cols = currentDates.length;
          const totalW = nameW + typeW + dateW * cols;
          const totalH = rowH * (2 + names.length * 2);
          const canvas = document.createElement('canvas');
          const dpr = Math.min(window.devicePixelRatio||2, 2);
          canvas.width  = totalW * dpr;
          canvas.height = totalH * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.fillStyle='#fff'; ctx.fillRect(0,0,totalW,totalH);
          const fnt=(sz,b)=>`${b?'bold ':' '}${sz}px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif`;
          const rect=(x,y,w,h,fill,stroke,lw)=>{
            if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
            if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);}
          };
          const txt=(t,x,y,sz,bold,color)=>{
            ctx.fillStyle=color||'#000';ctx.font=fnt(sz,bold);
            ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y);

          // 画面表示と同じく黒フチ付きで描く（コース番号用）

            ctx.font=fnt(sz,true);ctx.textAlign='center';ctx.textBaseline='middle';

            ctx.lineWidth=1;

          rect(nameW,0,typeW,rowH*2,'#cbd5e1','#777');
          txt('氏名',nameW/2,rowH,8,true);
          txt('区別',nameW+typeW/2,rowH,8,true);
          currentDates.forEach((date,i)=>{
            const x=nameW+typeW+i*dateW;
            const dstr=date.toLocaleDateString('sv-SE');
            const dow=date.getDay();
            const isHol=holidays.includes(dstr);
            const isToday=dstr===todayStr;
            const bg=isToday?'rgba(52,199,89,0.3)':'#e2e8f0';
            const color=isHol?'#800080':dow===0?'#ff0000':dow===6?'#006400':'#000';
            rect(x,0,dateW,rowH,bg,'#777');
            rect(x,rowH,dateW,rowH,bg,'#777');
            txt(`${date.getMonth()+1}/${date.getDate()}`,x+dateW/2,rowH*0.5,7,false,color);
            txt(`(${daysArr[dow]})`,x+dateW/2,rowH*1.5,7,false,color);
          });
          // ボディ
          const cColors={'1':'#007aff','2':'#ff3b30','3':'#34c759','4':'#9370DB','5':'#ff9500','6':'#32ade6','7':'#ffd600'};
          const baseY=rowH*2;
          names.forEach((name,ni)=>{
            const y1=baseY+ni*rowH*2, y2=y1+rowH;
            const isMe=name==='住友 正';

            rect(0,y1,nameW,rowH*2,nbg,'#777');

            rect(nameW,y1,typeW,rowH,nbg,'#777');
            txt('指定',nameW+typeW/2,y1+rowH/2,7,false,'#555');
            rect(nameW,y2,typeW,rowH,nbg,'#777',2);

            currentDates.forEach((date,di)=>{

              rect(x,y1,dateW,rowH,cbg,'#777');

              rect(x,y2,dateW,rowH,cbg,'#777',2); ctx.lineWidth=1;
              const c=data.course||'';
              if(c){
                if(cColors[c]){outlinedTxt(c,x+dateW/2,y2+rowH/2,15,cColors[c]);}

                else if(['コン','休希'].includes(c)){txt(c,x+dateW/2,y2+rowH/2,8,true,'#ee0000');}
                else if(c==='通区'){txt(c,x+dateW/2,y2+rowH/2,8,true,'#333');}
                else if(c==='承認欠勤'){
                  ctx.fillStyle='#000';ctx.font=fnt(7,true);ctx.textAlign='center';ctx.textBaseline='middle';

          loading.style.display='none';
          canvas.toBlob(blob=>{

            } else { fallbackOpenImage(blob,filename); }

        } catch(e){
          document.getElementById("loadingOverlay").style.display='none';
          alert('エラー: '+e.message);
        }
      }, 150);
    }

    function fallbackOpenImage(blob, filename) {
      const blobUrl = URL.createObjectURL(blob);
      if (/iPhone|iPad|iPod|Safari/i.test(navigator.userAgent) && !/Chrome|CriOS/i.test(navigator.userAgent)) {
        setTimeout(() => {
          alert("画像を生成しました。\n次の画面で画像を「長押し」して「写真に追加」を選択してください。");
          window.open(blobUrl, '_blank');
        }, 100);
      } else {
        const a = document.createElement("a"); a.href = blobUrl; a.download = filename; a.click();
        setTimeout(() => alert(`画像を「${filename}」としてダウンロードしました。`), 100);
      }
    }

(function ccExtraMoves() {

// はなちょうちん（s = 1〜3 の大きさ）

  if (s === 2) return [[AQUA_IN,x+1,y+1,2,2],[AQUA,x+1,y,2,1],[AQUA,x,y+1,1,2],[AQUA,x+3,y+1,1,2],[AQUA,x+1,y+3,2,1],[WHITE,x+1,y+1,1,1]];

// キャラクター1コマを作る
function fig(o = {}) {
  const dx = o.dx || 0, dy = o.dy || 0, sq = o.squash || 0, top = dy + sq, r = [];
  const R = (c, x, y, w, h) => r.push([c, x + dx, y, w, h]);
  if (o.pillow) R(WHITE, 0, top + 1, 24, 6);                  // まくら（体の後ろ）
  R(O, 4, top, 16, 12 - sq);                                  // 頭と体
  const arm = (side, pose) => {                               // 腕：side=0 左 / 20 右
    if (pose === 'hi') R(O, side, top - 3, 4, 7);             // 高く上げる
    else if (pose === 'up') R(O, side, top, 4, 4);            // 少し上げる
    else R(O, side, top + 4, 4, 4);                           // ふつう
  };
  arm(0, o.l); arm(20, o.r);
  const lift = o.lift || [];                                  // 持ち上げる足の番号
  if (!o.nolegs) [4, 8, 14, 18].forEach((x, i) => lift.includes(i) ? R(O, x, dy + 12, 2, 2) : R(O, x, dy + 12, 2, 4));
  const ey = top + 2 + (sq ? 1 : 0), lk = o.look || 0;        // 目
  const eye = (x, kind) => {
    if (kind === 'closed') R(K, x + lk, ey + 1, 2, 1);
    else if (kind === 'happy') { R(K, x - 1, ey + 1, 1, 1); R(K, x, ey, 2, 1); R(K, x + 2, ey + 1, 1, 1); }
    else if (kind === 'big') R(K, x, ey - 1, 2, 3);                                  // びっくりした大きな目
    else if (kind === 'angry') { const l = x < 12; R(K, l ? x : x + 1, ey, 1, 1); R(K, l ? x + 1 : x, ey + 1, 1, 1); R(K, x, ey + 2, 2, 1); }
    else if (kind === 'dizzy') { [[-1,-1],[1,-1],[0,0],[-1,1],[1,1]].forEach(([a, b]) => R(K, x + 1 + a, ey + b + 1, 1, 1)); }   // ×の目
    else R(K, x + lk, ey, 2, 2);
  };
  const e = o.eyes || 'open';
  eye(6, e === 'wink' ? 'closed' : e); eye(16, e === 'wink' ? 'open' : e);
  if (o.cheek) { R(CHEEK, 5, ey + 3, 2, 1); R(CHEEK, 17, ey + 3, 2, 1); }
  if (o.mouth === 'open') R(K, 11, ey + 4, 2, 2);             // 口（ふだんは描かない）
  else if (o.mouth === 'closed') R(K, 11, ey + 5, 2, 1);
  if (o.cap) {                                                // ナイトキャップ（先がたれて、白いぽんぽん）
    R(WHITE, 3, top - 1, 18, 2); R(CAP, 5, top - 3, 14, 2); R(CAP, 8, top - 5, 11, 2); R(CAP, 12, top - 7, 9, 2);
    R(CAP, 19, top - 6, 3, 2); R(WHITE, 22, top - 5, 2, 2);
  }
  if (o.quilt) {                                              // おふとん（体の前にかける）
    R(QUILT, -3, top + 6, 30, 16 - top - 6 + (o.dy || 0)); R(WHITE, -3, top + 6, 30, 2);
    [[0, 10], [8, 12], [16, 10], [24, 12]].forEach(([x, y]) => R(QUILT2, x - 2, top + y, 3, 2));
  }
  (o.extra || []).forEach(q => r.push(q));
  return r;
}

const RICE = '#fbf8f2', NORI = '#2f3b2f', BOWL = '#c94b3c', NOODLE = '#f2d36b', STICK = '#8b5a2b', STEAM = '#c9c2bc',
      SPONGE = '#f3d9a4', BERRY = '#e0475b', LEAF = '#5aa35a', TEA = '#6b9a5b', TEA_IN = '#b7d48a';
function onigiri(x, y, bite) {                                // bite 0=まるごと 1=ひとくち 2=はんぶん 3=ひとかけ
  if (bite >= 3) return [[RICE, x + 2, y + 3, 2, 1], [NORI, x + 2, y + 4, 2, 1]];
  if (bite === 2) return [[RICE, x + 3, y + 2, 3, 1], [RICE, x + 5, y + 3, 1, 1], [NORI, x + 3, y + 3, 2, 2]];
  if (bite === 1) return [[RICE, x + 3, y + 1, 2, 1], [RICE, x + 1, y + 2, 5, 2], [NORI, x + 1, y + 3, 4, 2]];
  return [[RICE, x + 2, y, 2, 1], [RICE, x + 1, y + 1, 4, 1], [RICE, x, y + 2, 6, 2], [NORI, x + 1, y + 3, 4, 2]];
}
function ramen(x, y, left) {                                  // どんぶり（left＝残りの量 2〜0）
  const r = [[BOWL, x, y + 1, 14, 2], [BOWL, x + 1, y + 3, 12, 1], [BOWL, x + 3, y + 4, 8, 1], [RICE, x, y + 2, 14, 1]];
  if (left > 0) r.push([NOODLE, x + 1, y, 12, 1]);
  if (left > 1) r.push([NOODLE, x + 3, y - 1, 3, 1], [NOODLE, x + 8, y - 1, 3, 1]);
  return r;
}
const steam = (x, y, k) => [[STEAM, x + (k % 2), y, 1, 2], [STEAM, x + 1 - (k % 2), y - 2, 1, 2], [STEAM, x + 4 - (k % 2), y - 1, 1, 2], [STEAM, x + 3 + (k % 2), y - 3, 1, 2]];
function cake(x, y, left) {                                   // ショートケーキ（left＝残りの幅 3〜0、いちごはberryがtrueのとき）
  const r = [[RICE, x - 1, y + 5, 10, 1]];                    // おさら
  const w = [0, 3, 5, 8][left];
  if (w) r.push([RICE, x, y + 1, w, 1], [SPONGE, x, y + 2, w, 3], [RICE, x, y + 3, w, 1]);
  return r;
}

// 食べたぶんを切り取る（side='left' は左から、'top' は上から）
function trim(rects, side, edge) {
  return rects.flatMap(([c, x, y, w, h]) => {
    if (side === 'left') { if (x + w <= edge) return []; const nx = Math.max(x, edge); return [[c, nx, y, w - (nx - x), h]]; }
    if (y + h <= edge) return []; const ny = Math.max(y, edge); return [[c, x, ny, w, h - (ny - y)]];
  });
}

function eatHeld(sprite, W, H, side, end, extraEnd = []) {

  for (let b = 0; b < 3; b++) {

    s.push([fig({ r: 'up', mouth: 'closed', extra: at(mx, my, b + 1) }), 160]);
    for (let c = 0; c < 3; c++) s.push([fig({ eyes: 'happy', mouth: c % 2 ? 'open' : 'closed', squash: c % 2, extra: at(rx, ry, b + 1) }), 190]);
  }
  s.push([fig({ eyes: 'happy', cheek: true, mouth: 'closed', extra: [...end, ...extraEnd] }), 900], [fig({ eyes: 'happy', cheek: true }), 400]);
  return s;
}

  }

function dress(name, desc, cos, o = {}) {
  const arms = o.arms || 'wave';
  const s = [[fig(), 400], [fig({ eyes: 'closed', extra: poof }), 250], [fig({ eyes: 'closed', extra: [...cos(0, 0), ...poof.slice(0, 3)] }), 200]];
  for (let k = 0; k < 6; k++) {

    s.push([fig({ dy: t, eyes: o.eyes || (k % 3 === 2 ? 'closed' : 'happy'), mouth: o.mouth, dx: o.step ? (k % 2 ? 1 : -1) : 0, lift: o.stomp ? (k % 2 ? [0, 1] : [2, 3]) : [],

  const SLEEP0 = svgOf.length, rect = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>';
  const zee = (x, y) => rect(x, y, 3, 1, '#8fa3d6') + rect(x + 1, y + 1, 1, 1, '#8fa3d6') + rect(x, y + 2, 3, 1, '#8fa3d6');
  for (let i = 0; i < 8; i++) {
    const s = i % 2, k = i % 4, o = COLOR.O;
    // 寝ているときは右に5マスずらして、体を下の「Claude Code」の文字の真ん中にそろえる（絵の幅34マスの真ん中＝17）
    svgOf.push('<g transform="translate(5,0)">' + rect(4, s, 16, 12 - s, o) + rect(0, s + 4, 4, 4, o) + rect(20, s + 4, 4, 4, o) +
      [4, 8, 14, 18].map(x => rect(x, 12, 2, 4, o)).join('') +
      rect(6, s * 2 + 3, 2, 1, COLOR.K) + rect(16, s * 2 + 3, 2, 1, COLOR.K) +
      zee(22, -1 - k) + (k >= 2 ? zee(26, -6 - (k - 2)) : '') + '</g>');
  }
  // 朝5時〜夜0時は、最初にパソコンを1回打ったあとは、01〜120 の動きからずっとランダムに出す。動き（見本ページの番号）からランダムに1つを1回だけ入れる
  const TYPE_MS = total * 1000 / 30, EVERY = 1;
  let mv = null, typeOff = 0, nextAt = TYPE_MS * EVERY, done = 0, last = -1;
  const RUN = Infinity;   // 最初にパソコンを1回打ったあとは、ずっとランダムな動きを続ける
  function extraFrame(now) {
    if (!mv) {
      if (now < nextAt) return null;
      let n; do { n = 1 + Math.floor(Math.random() * window.CC_EXTRA.length); } while (n === last); last = n;   // 同じ動きは続けない
      const seq = window.CC_EXTRA[n - 1].seq;
      mv = { n, t0: now, seq, total: seq.reduce((s, q) => s + q[1], 0),
             html: seq.map(q => '<g transform="translate(5,0)">' + q[0].map(([c, x, y, w, h]) => rect(x, y, w, h, c)).join('') + '</g>') };
    }
    let t = now - mv.t0;
    if (t >= mv.total) {   // 1回おわったら、パソコンを打つ動きを最初から（また1回打ったら次の動き）
      mv = null; done = (done + 1) % RUN;
      if (done) { nextAt = now; return extraFrame(now); }   // 続けて次の動き
      typeOff = Math.floor(now / (1000 / 30)); nextAt = now + TYPE_MS * EVERY; return null;
    }
    for (let k = 0; k < mv.seq.length; k++) { if (t < mv.seq[k][1]) return mv.html[k]; t -= mv.seq[k][1]; }
    return mv.html[0];
  }
  function draw(now) {
    const base = Math.floor(now / (1000 / 30));
    const hour = new Date().getHours();
    const extra = hour >= 5 && window.CC_EXTRA ? extraFrame(now) : null;   // ときどき入る動き
    const night = new Date().getHours() < 5;
    svgs.filter(s => s.isConnected).forEach(s => {
      if (extra) { if (shown.get(s) !== extra) { s.innerHTML = extra; shown.set(s, extra); } return; }
      const id = night ? SLEEP0 + Math.floor(now / 480) % 8 : frameAt(base - typeOff + (+s.dataset.skip || 0));
      if (shown.get(s) !== id) { s.innerHTML = svgOf[id]; shown.set(s, id); }
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

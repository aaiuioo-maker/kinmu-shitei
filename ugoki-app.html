<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a2a4a; color: #f3ead6; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom)); gap: 5px; }
  h1 { font-size: 15px; margin: 0; text-align: center; }
  .bar { display: flex; gap: 5px; justify-content: center; }
  button, select, input { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 7px; border: 1px solid #4a5a7a; background: #24365a; color: #f3ead6; min-width: 0; }
  button.on { background: #d97757; border-color: #d97757; color: #fff; font-weight: bold; }
  /* 上の グループの ボタン：たての はばを せまく。7つ あるので、せまい 画面では 2行（4つ・3つ）に おりかえす */
  #tabs { flex-wrap: wrap; }
  #tabs button { flex: 1 1 0; padding: 4px 2px; font-size: 12px; line-height: 1.2; white-space: nowrap; overflow: hidden; }
  #tabs button[data-g="yt"] { flex: 1.7 1 0; }   /* 名前が 長いので 少し 広く */
  @media (max-width: 600px) { #tabs button, #tabs button[data-g="yt"] { flex: 1 1 22%; } }
  #tabs small { font-size: 10px; opacity: .75; font-weight: normal; margin-left: 3px; }
  #lay button { flex: 1 1 0; padding: 5px 2px; }
  #opt > * { flex: 1 1 0; padding: 5px 4px; font-size: 12px; }
  #nav { align-items: center; }
  #nav button { font-size: 16px; padding: 6px 14px; }
  #pos { flex: 1 1 auto; text-align: center; font-size: 14px; font-weight: bold; white-space: nowrap; }
  #go { width: 4.5em; text-align: center; }
  #prog { height: 3px; background: #33466e; border-radius: 2px; overflow: hidden; flex: none; }
  #prog i { display: block; height: 100%; width: 0; background: #d97757; }
  /* 見せる場所：のこりの高さを ぜんぶ使う。スクロールは しない */
  #stage { flex: 1 1 0; min-height: 0; display: grid; gap: 6px; }
  .cell { background: #f4efe6; color: #2a2a2a; border-radius: 8px; padding: 5px 7px; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
  .cell svg { display: block; shape-rendering: crispEdges; min-width: 0; min-height: 0; }
  .txt { min-width: 0; overflow: hidden; }
  .no { font-weight: bold; color: #c0502a; }
  .name { font-weight: bold; line-height: 1.3; }
  .desc { opacity: .7; line-height: 1.35; }
  .who { font-size: 12px; color: #2a6a9a; margin-top: 4px; min-height: 1.3em; }
  /* 1個：まん中に 大きく。下に 番号・名前・説明 */
  .l1 { grid-template: 1fr / 1fr; }
  .l1 .cell { flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
  .l1 svg { flex: 0 1 auto; width: 100%; max-height: 62%; }
  .l1 .txt { text-align: center; }
  .l1 .no { font-size: 26px; } .l1 .name { font-size: 18px; margin: 2px 0; } .l1 .desc { font-size: 14px; }
  /* 3個：たてに 3つ。左に 絵・右に 番号・名前・説明 */
  .l3 { grid-template: repeat(3, 1fr) / 1fr; }
  .l3 .cell { flex-direction: row; align-items: center; gap: 8px; }
  .l3 svg { flex: 0 0 auto; height: 100%; max-width: 58%; aspect-ratio: 34 / 23; }
  .l3 .txt { flex: 1 1 0; }
  .l3 .no { font-size: 18px; } .l3 .name { font-size: 14px; } .l3 .desc { font-size: 12px; }
  /* 6個・8個：2れつ。上に 絵・下に 番号・名前・説明 */
  .l6 { grid-template: repeat(3, 1fr) / 1fr 1fr; }
  .l8 { grid-template: repeat(4, 1fr) / 1fr 1fr; }
  .l6 .cell, .l8 .cell { flex-direction: column; gap: 2px; padding: 4px 5px; }
  .l6 svg, .l8 svg { flex: 1 1 0; width: 100%; }
  .l6 .txt, .l8 .txt { flex: none; }
  .l6 .no, .l8 .no { font-size: 13px; display: inline; margin-right: 4px; }
  .l6 .name, .l8 .name { font-size: 12px; display: inline; }
  .l6 .desc { font-size: 10.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .l8 .desc { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.empty { background: transparent; }
  #msg { text-align: center; font-size: 14px; margin: auto; }
  a { color: #9fc4f0; font-size: 12px; }
  .foot { text-align: center; flex: none; }
  /* 横に 長い 画面（パソコン・横むきの スマホ）では 3個を 横に、6個・8個は 3れつ・4れつに */
  @media (orientation: landscape) {
    .l3 { grid-template: 1fr / repeat(3, 1fr); }
    .l3 .cell { flex-direction: column; align-items: stretch; }
    .l3 svg { flex: 1 1 0; height: auto; width: 100%; max-width: none; aspect-ratio: auto; }
    .l3 .txt { flex: none; text-align: center; }
    .l6 { grid-template: repeat(2, 1fr) / repeat(3, 1fr); }
    .l8 { grid-template: repeat(2, 1fr) / repeat(4, 1fr); }
    .l1 svg { max-height: 70%; }
  }

<body>
<h1>キャラクターの動き 確認アプリ</h1>
<div class="bar" id="tabs"></div>
<div class="bar" id="lay">
  <button data-n="1">1個</button><button data-n="3">3個</button><button data-n="6">6個</button><button data-n="8">8個</button>
</div>
<div class="bar" id="opt">
  <button id="rand">🔀 ランダム</button>
  <button id="koe">🗣 声</button>
  <select id="bgm" aria-label="BGM">
    <option value="0">♪ BGM なし</option><option value="1">♪ 1 そうげん</option><option value="2">♪ 2 夜の村</option><option value="3">♪ 3 どうくつ</option><option value="4">♪ 4 海の中</option><option value="5">♪ 5 ネザー</option>
  </select>
  <select id="vol" aria-label="音の 大きさ">
    <option value="0">🔇 消音</option><option value="1">🔈 小さい 音</option><option value="2">🔉 ふつう</option><option value="3">🔊 大きい 音</option>
  </select>

<!-- 動きは 勤務指定表（index.html）の中にあるので、見えないところで開いて そこから借りてくる（ugoki-check.html と同じ） -->
<iframe id="src" src="index.html?v=20261214" style="position:absolute;width:1px;height:1px;left:-9999px;border:0" aria-hidden="true"></iframe>
<script>
// ── キャラクターの動き 確認アプリ ──
//   1個（まん中に 大きく）／3個（たてに 3つ）／6個・8個（2れつ）で 番号・名前・説明つきで 見せる。
//   画面の 動きが 1回ずつ 終わったら、自動で 次へ 進む（⏸ で 止める・▶ ◀ で 自分で 送る）
//   🔀 ランダム … 番号の 順ではなく ばらばらの 順で 出す（一周するまで 同じ 動きは 出ない）
//   ♪ BGM … ブロックの世界ふうの 曲 5つから えらべる（音の ファイルは 使わず、その場で 音を 作る）。音の 大きさは 消音・小・ふつう・大
//   🗣 声 … 1個の ときに、18人の 読み手の だれか 1人が 名前と 説明を 読む（声は koe-ugoki/ に 作って ある。読み手は 動きごとに 決まっている）
const rect = (c, x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const KEY = 'ugokiApp';
const $ = id => document.getElementById(id);
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }

// ── BGM（ブロックの世界ふうの しずかな 曲。ドレミの 番号：60 = ド。0 は 休み。[音, 長さ(拍)] の ならび）──
//   ピアノのように「ポーン」と 鳴って 消えていく 音と、うすい こだま（エコー）で 広い 感じを 出す
const TUNES = {
  1: { bpm: 72, wave: 'triangle', decay: 2.4, mv: .8, bv: .55,   // そうげん（明るい ひる）
       mel: [[72,1],[76,1],[79,2],[77,1],[76,1],[74,2],[72,1],[74,1],[76,1],[79,1],[81,3],[0,1],
             [79,1],[77,1],[76,2],[74,1],[72,1],[71,2],[72,1],[67,1],[69,1],[71,1],[72,3],[0,1]],
       bas: [[48,4],[41,4],[45,4],[43,4],[41,4],[50,4],[52,4],[48,4]] },
  2: { bpm: 60, wave: 'sine', decay: 3, mv: .9, bv: .6,   // 夜の村（少し さみしい）
       mel: [[69,2],[72,1],[76,1],[74,2],[0,2],[72,1],[71,1],[69,2],[67,2],[0,2],
             [69,2],[72,1],[77,1],[76,3],[0,1],[74,1],[72,1],[71,1],[67,1],[69,4]],
       bas: [[45,8],[41,8],[38,8],[40,4],[45,4]] },
  3: { bpm: 52, wave: 'sine', decay: 3.5, mv: .9, bv: .7,   // どうくつ（ひくくて ひろい）
       mel: [[62,1],[69,1],[0,2],[65,1],[64,1],[0,2],[62,1],[60,1],[57,2],[0,4],
             [70,1],[69,1],[0,2],[65,1],[67,1],[0,2],[64,1],[62,3],[0,4]],
       bas: [[38,8],[46,8],[48,8],[50,8]] },
  4: { bpm: 66, wave: 'triangle', decay: 2.6, mv: .75, bv: .5,   // 海の中（ふわふわ）
       mel: [[65,.5],[69,.5],[72,.5],[76,.5],[79,2],[0,1],[77,.5],[76,.5],[71,2],[72,1],[0,1],
             [69,.5],[72,.5],[76,.5],[79,.5],[83,2],[81,1],[79,1],[76,2],[0,2]],
       bas: [[41,4],[43,4],[41,4],[45,4],[43,4]] },
  5: { bpm: 48, wave: 'sine', decay: 4, mv: .9, bv: .75,   // ネザー（くらくて あやしい）
       mel: [[57,2],[58,2],[0,2],[52,1],[57,1],[56,4],[0,4],
             [60,2],[58,1],[57,1],[0,2],[53,2],[52,4],[0,4]],
       bas: [[45,8],[46,8],[45,8],[40,8]] },
};
const VOL = [0, .07, .15, .28];
const music = { ctx: null, gain: null, bus: null, tune: 0, vol: 2, timer: null, p: null,
  apply() {   // えらんだ BGM と 音の 大きさに 合わせる（音を 出すのは 画面を さわった あと）
    const on = this.tune > 0 && this.vol > 0 && TUNES[this.tune];
    if (!on) { if (this.timer) { clearInterval(this.timer); this.timer = null; } if (this.gain) this.gain.gain.value = 0; return; }
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC(); this.gain = c.createGain(); this.gain.connect(c.destination);
      // こだま：音を 少し おくらせて、だんだん 小さく くり返す
      this.bus = c.createGain(); this.bus.connect(this.gain);
      const d = c.createDelay(1), fb = c.createGain(), wet = c.createGain(), lp = c.createBiquadFilter();
      d.delayTime.value = .42; fb.gain.value = .35; wet.gain.value = .35; lp.type = 'lowpass'; lp.frequency.value = 1800;
      this.bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(this.gain);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.gain.gain.value = VOL[this.vol];
    if (!this.timer || this.p.id !== this.tune) { if (this.timer) clearInterval(this.timer); const t = this.ctx.currentTime + .08; this.p = { id: this.tune, mi: 0, mt: t, bi: 0, bt: t }; this.timer = setInterval(() => this.tick(), 60); }
  },
  note(midi, t, wave, v, decay) {   // ポーン と 鳴って ゆっくり 消える 音（上に 小さく 1オクターブ上の 音を かさねる）
    if (!midi) return;
    const f = 440 * Math.pow(2, (midi - 69) / 12), g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + decay);
    g.connect(this.bus);
    [[1, wave, 1], [2, 'sine', .18]].forEach(([k, w, a]) => {
      const o = this.ctx.createOscillator(), og = this.ctx.createGain(); o.type = w; o.frequency.value = f * k; og.gain.value = a;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + decay + .05);
    });
  },
  tick() {
    const T = TUNES[this.p.id], beat = 60 / T.bpm, now = this.ctx.currentTime, p = this.p;
    if (p.mt < now - .5) { p.mt = p.bt = now + .05; }   // 画面を とじて いた 間の ぶんは とばす
    while (p.mt < now + .25) { const [m, d] = T.mel[p.mi]; this.note(m, p.mt, T.wave, T.mv, T.decay); p.mt += d * beat; p.mi = (p.mi + 1) % T.mel.length; if (p.mi === 0) { p.bi = 0; p.bt = p.mt; } }
    while (p.bt < now + .25 && p.bt < p.mt) { const [m, d] = T.bas[p.bi % T.bas.length]; this.note(m, p.bt, 'sine', T.bv, Math.min(T.decay * 1.4, d * beat + 1)); p.bt += d * beat; p.bi++; }
  } };

// ── 読み上げの 声 ──
//   yomite.json：{ "グループ/番号": [読み手の フォルダ, 文の 印] }。印が 今の 名前・説明と 合うときだけ 鳴らす（文を 直したら 古い 声は 出さない）
const KOE_NAME = { 'koe': '四国めたん', 'koe-tsumugi': '春日部つむぎ', 'koe-hau': '雨晴はう', 'koe-sayo': '小夜', 'koe-himari': '冥鳴ひまり',
  'koe-nurserobo': 'ナースロボ＿タイプＴ', 'koe-tsukuyomi': 'つくよみちゃん', 'koe-mana': 'MANA', 'koe-kana': 'KANA', 'koe-ameno-kuma': 'アメノちゃん（熊本弁）',
  'koe-lilin': 'リリンちゃん', 'koe-mao': 'まお', 'koe-mai': 'まい', 'koe-kohaku': 'コハク', 'koe-chuni': '中2', 'koe-runa': 'るな', 'koe-kanon': '花音', 'koe-sakurane': '桜音' };
const KOE_VOL = [0, .45, .75, 1];
function h32(s) {   // 文の 印（koe_tsukuru.py と 同じ 計算）
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
let YOMITE = {};
fetch('koe-ugoki/yomite.json?v=20261215').then(r => r.ok ? r.json() : {}).then(j => { YOMITE = j || {}; window.dispatchEvent(new Event('yomite')); }).catch(() => {});

function start(X, GROUPS) {
  const st = { g: GROUPS[0][0], n: 1, i: 0, auto: true, rand: false, bgm: 0, vol: 2, koe: true, ...load() };
  if (!GROUPS.some(([g]) => g === st.g)) st.g = GROUPS[0][0];
  if (![1, 3, 6, 8].includes(st.n)) st.n = 1;
  const hash = location.hash.slice(1);
  if (GROUPS.some(([g]) => g === hash)) { if (hash !== st.g) st.i = 0; st.g = hash; }
  const stage = $('stage'), bar = $('prog').firstChild;
  let list = [], order = [], cells = [], t0 = 0, pageMs = 1;

  const tabs = GROUPS.map(([g, name, mark]) => {
    const b = document.createElement('button'); b.dataset.g = g;
    const short = { mc: 'マイクラ', hxh: 'ハンター', yubin: '郵便', yt: 'ユーチューバー', tana: '動画棚', sekai: '世界', goshin: '御神書' }[g] || name;   // ボタンは 短い 名前で
    b.innerHTML = `${short}<small>${X.filter(m => m.g === g).length}</small>`;
    b.onclick = () => { st.g = g; st.i = 0; deal(); show(); };
    $('tabs').append(b); return b;
  });
  const lays = [...$('lay').children];
  lays.forEach(b => b.onclick = () => { st.n = +b.dataset.n; st.i = Math.floor(st.i / st.n) * st.n; show(); });
  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  $('auto').onclick = () => { st.auto = !st.auto; t0 = performance.now(); paint(); save(st); };
  $('rand').onclick = () => { const cur = order[st.i]; st.rand = !st.rand; deal(); st.i = st.rand ? 0 : Math.floor(cur / st.n) * st.n; show(); };   // 順番に もどすときは 今 見ている 番号から
  $('go').onchange = e => { const v = +e.target.value; if (v >= 1 && v <= list.length) { const at = order.indexOf(v - 1); st.i = Math.floor(at / st.n) * st.n; show(); } e.target.value = ''; e.target.blur(); };
  $('bgm').value = st.bgm; $('vol').value = st.vol;
  $('bgm').onchange = e => { st.bgm = +e.target.value; if (st.bgm && !st.vol) { st.vol = 2; $('vol').value = 2; } sound(); };
  $('vol').onchange = e => { st.vol = +e.target.value; sound(); if (voice.a) voice.a.volume = KOE_VOL[st.vol]; if (!st.vol) voice.stop(); };
  function sound() { music.tune = st.bgm; music.vol = st.vol; music.apply(); save(st); }
  // 前に BGM を えらんで いたら、画面を さいしょに さわった ときに 鳴らしはじめる（さわる 前は 音を 出せない きまり）
  if (st.bgm && st.vol) addEventListener('pointerdown', function once() { removeEventListener('pointerdown', once); sound(); });
  // 声：さわる 前で 鳴らせなかった ときは、さいしょに さわった ときに 鳴らす
  //   声の 入れものは 1つだけ。さいしょに さわった ときに 使えるように しておくと、そのあと 自動で 次へ 進んでも 鳴らせる（スマホの きまり）
  const voice = { el: new Audio(), a: null, wait: false, ok: false, n: 0,
    stop() { this.el.pause(); this.a = null; this.wait = false; },
    play(m, who) {
      this.stop(); who.textContent = '';
      if (st.n !== 1 || !st.koe || !st.vol || !m) return;
      const y = YOMITE[m.g + '/' + m.no];
      if (!y || y[1] !== h32((m.name || '') + '\n' + (m.desc || ''))) return;
      const a = this.el, id = ++this.n; this.a = id;
      a.src = 'koe-ugoki/' + m.g + '/' + m.no + '.mp3';
      a.volume = KOE_VOL[st.vol];
      who.textContent = '🗣 ' + (KOE_NAME[y[0]] || '');
      a.onloadedmetadata = () => { if (this.a === id && isFinite(a.duration)) pageMs = Math.max(pageMs, a.duration * 1000 + 700); };   // 読み終わるまで 次へ 行かない
      a.play().then(() => { this.ok = true; }).catch(() => { if (this.a === id) this.wait = true; });
    },
    replay() { if (this.a) { this.el.currentTime = 0; this.wait = false; this.el.play().then(() => { this.ok = true; }).catch(() => {}); } },
    unlock() {   // さわった ときに 入れものを 使えるように する（鳴らす 声が ないときは 音なしで 一瞬 動かす）
      if (this.wait) { this.replay(); return; }
      if (this.ok || this.a) return;
      const a = this.el; a.muted = true;
      a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
      a.play().then(() => { this.ok = true; }).catch(() => {}).finally(() => { if (!this.a) a.pause(); a.muted = false; });
    } };
  addEventListener('pointerdown', () => voice.unlock());
  // 画面を 消したり ほかの アプリに 行ったり すると、スマホが 音を 止めることが ある → もどったとき・さわったときに 動かし直す
  function wake() {
    if (music.ctx && music.ctx.state !== 'running' && music.tune && music.vol) { music.ctx.resume().catch(() => {}); }
    if (music.ctx && music.tune && music.vol && !music.timer) music.apply();
  }
  addEventListener('pointerdown', wake);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  addEventListener('pageshow', wake);
  addEventListener('yomite', () => { if (st.n === 1) show(); });
  $('koe').onclick = () => { st.koe = !st.koe; save(st); paint(); if (st.koe) { if (!st.vol) { st.vol = 2; $('vol').value = 2; } show(); } else voice.stop(); };
  stage.onclick = () => { t0 = performance.now(); voice.replay(); };   // 絵を おすと 今の ページを 最初から

  // 出す 順番を 決める：ふつうは 番号の 順、ランダムは ばらばらに まぜる
  function deal() {
    list = X.filter(m => m.g === st.g); order = list.map((_, i) => i);
    if (st.rand) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }
  function step(d) {
    const pages = Math.ceil(list.length / st.n); let p = Math.floor(st.i / st.n) + d;
    if (p >= pages) { p = 0; if (st.rand) deal(); }   // ランダムは 一周したら まぜなおす
    if (p < 0) p = pages - 1;
    st.i = p * st.n; show();
  }
  function paint() {
    tabs.forEach(b => b.classList.toggle('on', b.dataset.g === st.g));
    lays.forEach(b => b.classList.toggle('on', +b.dataset.n === st.n));
    $('auto').textContent = st.auto ? '⏸' : '⏵'; $('auto').classList.toggle('on', !st.auto);
    $('rand').classList.toggle('on', st.rand);
    $('koe').classList.toggle('on', st.koe); $('koe').textContent = st.koe ? '🗣 声 あり' : '🗣 声 なし';
    const a = st.i + 1, b = Math.min(st.i + st.n, list.length);
    $('pos').textContent = (st.rand ? '🔀 ' : '') + (a === b ? a : a + '〜' + b) + ' ／ ' + list.length;
  }
  // 今の グループ・ならべ方・場所で 画面を 作りなおす
  function show() {
    if (st.i >= list.length) st.i = 0;
    const mark = (GROUPS.find(([g]) => g === st.g) || [])[2] || '';
    stage.className = 'l' + st.n; stage.textContent = ''; cells = [];
    for (let k = 0; k < st.n; k++) {
      const m = list[order[st.i + k]], el = document.createElement('div');
      if (!m) { el.className = 'cell empty'; stage.append(el); continue; }
      el.className = 'cell';
      el.innerHTML = `<svg viewBox="-5 -7 34 23" preserveAspectRatio="xMidYMid meet"></svg><div class="txt"><div class="no">${mark}${m.no}</div><div class="name"></div><div class="desc"></div></div>`;
      el.querySelector('.name').textContent = m.name || ''; el.querySelector('.desc').textContent = m.desc || '';
      stage.append(el);
      cells.push({ svg: el.querySelector('svg'), seq: m.seq, html: m.seq.map(q => q[0].map(r => rect(...r)).join('')), total: m.seq.reduce((s, q) => s + q[1], 0), k: -1 });
    }
    pageMs = Math.max(...cells.map(c => c.total), 1) + 900;   // いちばん 長い 動きが 終わって 少し してから 次へ
    if (st.n === 1) { const w = document.createElement('div'); w.className = 'who'; stage.querySelector('.txt').append(w); voice.play(list[order[st.i]], w); } else voice.stop();
    t0 = performance.now(); paint(); save(st);
    history.replaceState(null, '', '#' + st.g);
  }
  deal(); if (st.rand) st.i = 0; show();
  (function frame(now) {
    const t = now - t0;
    for (const c of cells) {
      let u = Math.min(t, c.total - 1), k = 0;
      while (k < c.seq.length - 1 && u >= c.seq[k][1]) { u -= c.seq[k][1]; k++; }   // 短い 動きは 最後の コマで 待つ
      if (k !== c.k) { c.svg.innerHTML = c.html[k]; c.k = k; }
    }
    bar.style.width = Math.min(100, t / pageMs * 100) + '%';
    if (t >= pageMs) { if (st.auto) step(1); else { t0 = now; cells.forEach(c => c.k = -1); } }   // 止めている 間は 同じ ページを くり返す
    requestAnimationFrame(frame);
  })(performance.now());
  addEventListener('keydown', e => { if (/INPUT|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === ' ') { e.preventDefault(); $('auto').click(); } });
}
const ifr = $('src');
ifr.addEventListener('load', () => {
  const X = ifr.contentWindow.CC_EXTRA, G = ifr.contentWindow.CC_GROUPS;
  if (X && X.length && G) start(X, G); else $('msg').textContent = '動きを読みこめませんでした';
});
</script>
</body>

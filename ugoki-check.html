<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動きの確認</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a2a4a; color: #f3ead6; }
  body { font-family: sans-serif; padding: calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 17px; margin: 0 0 4px; text-align: center; }
  .sub { font-size: 12px; opacity: .7; text-align: center; margin: 0 0 10px; }
  .bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bar button { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #4a5a7a; background: #24365a; color: #f3ead6; }
  .tabs button { font-size: 14px; font-weight: bold; padding: 8px 12px; }
  .tabs button small { display: block; font-size: 11px; font-weight: normal; opacity: .7; }
  .tabs button.on { background: #d97757; border-color: #d97757; color: #fff; }
  .card[hidden] { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: 1000px; margin: 0 auto; }
  .card { background: #f4efe6; color: #2a2a2a; border-radius: 6px; padding: 4px 6px 6px; cursor: pointer; }
  .card svg { width: 100%; display: block; shape-rendering: crispEdges; }
  .no { font-weight: bold; color: #c0502a; font-size: 13px; }
  .name { font-size: 12px; line-height: 1.3; }
  .desc { font-size: 10px; opacity: .6; line-height: 1.3; }
  #msg { text-align: center; font-size: 14px; margin: 20px; }
</style>
</head>
<body>
<h1>キャラクターの動き 確認ページ</h1>
<p class="sub">勤務指定表の案内役と同じ動きを 4つのグループに分けて 番号つきで 並べています（番号は グループごとに 1 から）／ カードをタップすると最初から<br><a href="ugoki-app.html" style="color:#9fc4f0">1個・3個・6個・8個ずつ 順番に 見る（確認アプリ）</a></p>
<div class="bar tabs" id="bar"></div>
<div class="bar" id="jump"></div>
<div id="msg">読みこみ中…</div>
<div class="grid" id="grid"></div>
<!-- 動きは 勤務指定表（index.html）の中にあるので、見えないところで開いて そこから借りてくる -->
<iframe id="src" src="index.html?v=20261216" style="position:absolute;width:1px;height:1px;left:-9999px;border:0" aria-hidden="true"></iframe>
<script>
const rect = (c, x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const cards = [];
function start(X, GROUPS) {
  document.getElementById('msg').remove();
  const grid = document.getElementById('grid'), bar = document.getElementById('bar'), jump = document.getElementById('jump');
  // カードは ぜんぶ作っておいて、えらんだグループのものだけ 見せる。番号は グループごとに 1 から（cc-chara.js が付けた m.no）
  X.forEach((m, i) => {
    const card = document.createElement('div'); card.className = 'card'; card.id = 'c' + i; card.dataset.g = m.g; card.hidden = true;
    const html = m.seq.map(q => q[0].map(r => rect(...r)).join(''));
    card.innerHTML = `<svg viewBox="-5 -7 34 23"></svg><div class="no">${m.no}</div><div class="name">${m.name || ''}</div><div class="desc">${m.desc || ''}</div>`;
    grid.append(card);
    const c = { svg: card.querySelector('svg'), seq: m.seq, html, total: m.seq.reduce((s, q) => s + q[1], 0) + 600, t0: performance.now(), k: -1 };
    card.addEventListener('click', () => { c.t0 = performance.now(); });
    cards.push(c);
  });
  // 上のボタン：4つのグループを 切りかえる
  const tabs = GROUPS.map(([g, name]) => {
    const b = document.createElement('button'); b.dataset.g = g;
    b.innerHTML = `${name}<small>${X.filter(m => m.g === g).length} 個</small>`;
    b.onclick = () => show(g, true);
    bar.append(b); return b;
  });
  // 下のボタン：えらんだグループの中で とべる。キャラクターが 5人までなら キャラクターごと、多いときは 50 番ごと
  function show(g, save) {
    tabs.forEach(b => b.classList.toggle('on', b.dataset.g === g));
    X.forEach((m, i) => { document.getElementById('c' + i).hidden = m.g !== g; });
    const mine = X.map((m, i) => [m, i]).filter(([m]) => m.g === g), jumps = [];
    const charas = [...new Set(mine.map(([m]) => (m.name || '').split('：')[0]))];
    if (charas.length <= 5) {
      charas.forEach(c => { const ms = mine.filter(([m]) => (m.name || '').split('：')[0] === c); jumps.push([ms[0][1], `${c} ${ms[0][0].no}〜${ms[ms.length - 1][0].no}`]); });
    } else if (mine.length > 50) {
      for (let k = 0; k < mine.length; k += 50) jumps.push([mine[k][1], `${k + 1}〜${Math.min(k + 50, mine.length)}`]);
    }
    jump.textContent = '';
    jumps.forEach(([i, label]) => {
      const b = document.createElement('button'); b.textContent = label;
      b.onclick = () => document.getElementById('c' + i).scrollIntoView({ behavior: 'smooth' });
      jump.append(b);
    });
    if (save) { history.replaceState(null, '', '#' + g); scrollTo(0, 0); }
  }
  // ページの住所のうしろに #hxh などが付いていたら そのグループから始める
  const first = location.hash.slice(1);
  show(GROUPS.some(([g]) => g === first) ? first : GROUPS[0][0], false);
  // 画面に見えているカードだけ動かす（軽くするため）
  const seen = new Set();
  const io = new IntersectionObserver(es => es.forEach(e => { const c = cards[+e.target.id.slice(1)]; e.isIntersecting ? seen.add(c) : seen.delete(c); }));
  cards.forEach((c, i) => io.observe(document.getElementById('c' + i)));
  (function frame(now) {
    for (const c of seen) {
      let t = (now - c.t0) % c.total, k = 0;
      while (k < c.seq.length && t >= c.seq[k][1]) { t -= c.seq[k][1]; k++; }
      if (k >= c.seq.length) k = c.seq.length - 1; // 最後は少し止めてから くり返す
      if (k !== c.k) { c.svg.innerHTML = c.html[k]; c.k = k; }
    }
    requestAnimationFrame(frame);
  })(performance.now());
}
const ifr = document.getElementById('src');
ifr.addEventListener('load', () => {
  const X = ifr.contentWindow.CC_EXTRA, G = ifr.contentWindow.CC_GROUPS;
  if (X && X.length && G) start(X, G); else document.getElementById('msg').textContent = '動きを読みこめませんでした';
});
</script>
</body>
</html>

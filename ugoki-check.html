<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動きの確認</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a2a4a; color: #f3ead6; }
  body { font-family: sans-serif; padding: calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 17px; margin: 0 0 4px; text-align: center; }
  .sub { font-size: 12px; opacity: .7; text-align: center; margin: 0 0 10px; }
  .bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bar button { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid #4a5a7a; background: #24365a; color: #f3ead6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: 1000px; margin: 0 auto; }
  .card { background: #f4efe6; color: #2a2a2a; border-radius: 6px; padding: 4px 6px 6px; cursor: pointer; }
  .card svg { width: 100%; display: block; shape-rendering: crispEdges; }
  .no { font-weight: bold; color: #c0502a; font-size: 13px; }
  .name { font-size: 12px; line-height: 1.3; }
  .desc { font-size: 10px; opacity: .6; line-height: 1.3; }
  #msg { text-align: center; font-size: 14px; margin: 20px; }
</style>
</head>
<body>
<h1>キャラクターの動き 確認ページ</h1>
<p class="sub">勤務指定表の案内役と同じ動きを 番号つきで ぜんぶ並べています ／ カードをタップすると最初から</p>
<div class="bar" id="bar"></div>
<div id="msg">読みこみ中…</div>
<div class="grid" id="grid"></div>
<!-- 動きは 勤務指定表（index.html）の中にあるので、見えないところで開いて そこから借りてくる -->
<iframe id="src" src="index.html" style="position:absolute;width:1px;height:1px;left:-9999px;border:0" aria-hidden="true"></iframe>
<script>
const rect = (c, x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const cards = [];
function start(X) {
  document.getElementById('msg').remove();
  const grid = document.getElementById('grid'), bar = document.getElementById('bar');
  X.forEach((m, i) => {
    const card = document.createElement('div'); card.className = 'card'; card.id = 'n' + (i + 1);
    const html = m.seq.map(q => q[0].map(r => rect(...r)).join(''));
    card.innerHTML = `<svg viewBox="-5 -7 34 23"></svg><div class="no">${i + 1}</div><div class="name">${m.name || ''}</div><div class="desc">${m.desc || ''}</div>`;
    grid.append(card);
    const c = { svg: card.querySelector('svg'), seq: m.seq, html, total: m.seq.reduce((s, q) => s + q[1], 0) + 600, t0: performance.now(), k: -1 };
    card.addEventListener('click', () => { c.t0 = performance.now(); });
    cards.push(c);
  });
  // 50 番ごとに とべるボタン
  for (let n = 1; n <= X.length; n += 50) {
    const b = document.createElement('button'); b.textContent = n + '〜';
    b.onclick = () => document.getElementById('n' + n).scrollIntoView({ behavior: 'smooth' });
    bar.append(b);
  }
  // 画面に見えているカードだけ動かす（軽くするため）
  const seen = new Set();
  const io = new IntersectionObserver(es => es.forEach(e => { const c = cards[+e.target.id.slice(1) - 1]; e.isIntersecting ? seen.add(c) : seen.delete(c); }));
  cards.forEach((c, i) => io.observe(document.getElementById('n' + (i + 1))));
  (function frame(now) {
    for (const c of seen) {
      let t = (now - c.t0) % c.total, k = 0;
      while (k < c.seq.length && t >= c.seq[k][1]) { t -= c.seq[k][1]; k++; }
      if (k >= c.seq.length) k = c.seq.length - 1; // 最後は少し止めてから くり返す
      if (k !== c.k) { c.svg.innerHTML = c.html[k]; c.k = k; }
    }
    requestAnimationFrame(frame);
  })(performance.now());
}
const ifr = document.getElementById('src');
ifr.addEventListener('load', () => {
  const X = ifr.contentWindow.CC_EXTRA;
  if (X && X.length) start(X); else document.getElementById('msg').textContent = '動きを読みこめませんでした';
});
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUNTER×HUNTER に変身 30</title>
<meta name="theme-color" content="#1a2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1a2a4a; --fg:#f3ead6; --accent:#d97757; --green:#6fd35a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; text-align: center; }
  .sub { font-size: 12px; opacity: .7; margin: 0 0 12px; text-align: center; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 820px; margin: 0 auto; }
  .card { background: #12101f; border: 2px solid #2a3a5e; border-radius: 6px; padding: 6px; cursor: pointer; }
  .card:active { transform: translateY(1px); }
  canvas { width: 100%; display: block; image-rendering: pixelated; border-radius: 4px; background: #000; }
  .no { color: var(--accent); font-size: 12px; margin-top: 6px; }
  .mob { font-size: 15px; color: #ffd08a; }
  .name { font-size: 13px; color: var(--green); }
  .how { font-size: 11px; opacity: .7; margin-top: 2px; line-height: 1.4; }
</style>
</head>
<body>
<h1>オレンジのキャラクター → HUNTER×HUNTER</h1>
<p class="sub">勤務指定表の 301〜330 番と同じ 30 とおりの変身（十二支の12人と ゴン・キルアたち18人）<br>カードをタップすると 最初から</p>
<div class="grid" id="grid"></div>
<!-- 形・変身のパターンは 勤務指定表と同じ cc-chara.js から借りてくる -->
<script src="cc-chara.js"></script>
<script>
const { G, GROUND, hash, seg, makeG } = window.CC_HENSHIN;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const PATTERNS = window.CC_HENSHIN.hxh, S = 5, LOOP = 5;  // 1ドットの大きさ・ループの長さ（秒）

// キャンバスに描く道具
function canvasG(ctx) {
  return makeG({
    R(x, y, w, h, c, a = 1) { ctx.globalAlpha = clamp(a); ctx.fillStyle = c; ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.round(w * S), Math.round(h * S)); ctx.globalAlpha = 1; },
    T(s, x, y, size, c, a = 1) {
      if (a <= 0) return;
      ctx.globalAlpha = clamp(a); ctx.font = `${size * S}px "DotGothic16", monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = S * 1.2; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#000'; ctx.strokeText(s, x * S, y * S); ctx.fillStyle = c; ctx.fillText(s, x * S, y * S); ctx.globalAlpha = 1;
    },
    clip(x, y, w, h, fn) { ctx.save(); ctx.beginPath(); ctx.rect(x * S, y * S, w * S, h * S); ctx.clip(); fn(); ctx.restore(); },
    shake(dx, dy, fn) { ctx.save(); ctx.translate(Math.round(dx) * S, Math.round(dy) * S); fn(); ctx.restore(); },
  });
}
// 背景：夜空と草ブロックの地面
function scene(g, t) {
  g.R(0, 0, G, G, '#0b0a1a');
  for (let i = 0; i < 14; i++) { const b = .4 + .6 * Math.abs(Math.sin(t * 1.5 + i)); g.R((hash(i) * G) | 0, (hash(i + 50) * 30) | 0, 1, 1, '#ffffff', b * .7); }
  g.R(0, GROUND, G, G - GROUND, '#7a5230');
  g.R(0, GROUND, G, 2, '#4f9a3a'); g.R(0, GROUND, G, 1, '#6cc04a');
  for (let x = 1; x < G; x += 5) g.R(x, GROUND + 3 + (x % 3), 1, 1, '#5e3e22');
}
// カードを並べて動かす
const grid = document.getElementById('grid'), cards = [];
PATTERNS.forEach((p, i) => {
  const card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = cv.height = G * S;
  card.append(cv);
  card.insertAdjacentHTML('beforeend', `<div class="no">${301 + i} 番</div><div class="mob">${p.mob}</div><div class="name">${p.name}</div><div class="how">${p.how}</div>`);
  grid.append(card);
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const c = { p, g: canvasG(ctx), t0: performance.now() / 1000 - i * .25 };
  card.addEventListener('click', () => { c.t0 = performance.now() / 1000; });
  cards.push(c);
});
function frame(now) {
  for (const c of cards) {
    const t = (now / 1000 - c.t0) % LOOP;
    scene(c.g, t);
    c.p.draw(c.g, t);
    const fade = seg(t, LOOP - .4, LOOP); // 最後は 少し暗くして ループ
    if (fade > 0) c.g.R(0, 0, G, G, '#000000', fade);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
